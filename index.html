 steps:[
  {t:'story',bg:'field',prop:'🌾',text:L('Priya is 15 and top of her class. Her family has decided she will be married after the harvest.','प्रिया 15 साल की है और कक्षा में अव्वल। परिवार ने तय किया है कि फ़सल कटने के बाद उसकी शादी होगी।','பிரியாவுக்கு 15 வயது, வகுப்பில் முதல் மாணவி. அறுவடைக்குப் பிறகு அவளுக்குத் திருமணம் என்று குடும்பம் முடிவு செய்திருக்கிறது.','ప్రియ వయసు 15, తరగతిలో మొదటి స్థానం. కోతల తర్వాత ఆమె పెళ్లి చేయాలని కుటుంబం నిర్ణయించింది.','ਪ੍ਰੀਆ 15 ਸਾਲ ਦੀ ਹੈ ਤੇ ਜਮਾਤ ਵਿੱਚ ਅੱਵਲ। ਪਰਿਵਾਰ ਨੇ ਤੈਅ ਕੀਤਾ ਹੈ ਕਿ ਵਾਢੀ ਤੋਂ ਬਾਅਦ ਉਸਦਾ ਵਿਆਹ ਹੋਵੇਗਾ।'),
   cast:[{who:'priya',mood:'worried',say:L('Maa, I want to finish class 10 first.','माँ, मुझे पहले दसवीं पूरी करनी है।','அம்மா, நான் முதலில் 10-ஆம் வகுப்பை முடிக்க வேண்டும்.','అమ్మా, నేను ముందు పదో తరగతి పూర్తి చేయాలి.','ਮਾਂ, ਮੈਂ ਪਹਿਲਾਂ ਦਸਵੀਂ ਪੂਰੀ ਕਰਨੀ ਹੈ।')},{who:'maa',mood:'sad',say:L('After the harvest you will be married. Everyone is invited.','फ़सल कटने के बाद तेरी शादी होगी। सबको बुला लिया है।','அறுவடைக்குப் பிறகு உனக்குத் திருமணம். எல்லோரையும் அழைத்துவிட்டோம்.','కోతల తర్వాత నీ పెళ్లి. అందరినీ పిలిచేశాం.','ਵਾਢੀ ਤੋਂ ਬਾਅਦ ਤੇਰਾ ਵਿਆਹ ਹੋਊ। ਸਭ ਨੂੰ ਸੱਦ ਲਿਆ ਹੈ।')}]},
  {t:'choice',bg:'field',prop:'🌾',text:L('What should Priya do?','प्रिया को क्या करना चाहिए?','பிரியா என்ன செய்ய வேண்டும்?','ప్రియ ఏమి చేయాలి?','ਪ੍ਰੀਆ ਨੂੰ ਕੀ ਕਰਨਾ ਚਾਹੀਦਾ ਹੈ?'),
   cast:[{who:'priya',mood:'sad'}],
   options:[
    {label:L('Accept it. Elders know best.','मान लो। बड़े बेहतर जानते हैं।','ஏற்றுக்கொள். பெரியவர்களுக்கே நன்றாகத் தெரியும்.','ఒప్పుకో. పెద్దవాళ్లకే బాగా తెలుసు.','ਮੰਨ ਲਓ। ਵੱਡੇ ਬਿਹਤਰ ਜਾਣਦੇ ਨੇ।'),ok:false,bg:'field',
     text:L('Priya leaves school. Marrying too young can harm a girl\'s health, education and future, and takes away her choice.','प्रिया स्कूल छोड़ देती है। बहुत कम उम्र में शादी लड़की की सेहत, पढ़ाई और भविष्य को नुक़सान पहुँचा सकती है और उसकी पसंद छीन लेती है।','பிரியா பள்ளியை விட்டு நிற்கிறாள். மிகச் சிறு வயதில் திருமணம் ஒரு பெண்ணின் உடல்நலம், கல்வி, எதிர்காலத்தைப் பாதிக்கும்; அவளின் தேர்வுரிமையையும் பறிக்கும்.','ప్రియ బడి మానేస్తుంది. చిన్న వయసులో పెళ్లి ఆడపిల్ల ఆరోగ్యం, చదువు, భవిష్యత్తును దెబ్బతీస్తుంది, ఆమె ఎంపికను లాగేసుకుంటుంది.','ਪ੍ਰੀਆ ਸਕੂਲ ਛੱਡ ਦਿੰਦੀ ਹੈ। ਬਹੁਤ ਛੋਟੀ ਉਮਰ ਵਿੱਚ ਵਿਆਹ ਕੁੜੀ ਦੀ ਸਿਹਤ, ਪੜ੍ਹਾਈ ਤੇ ਭਵਿੱਖ ਨੂੰ ਨੁਕਸਾਨ ਪਹੁੰਚਾ ਸਕਦਾ ਹੈ ਤੇ ਉਸਦੀ ਪਸੰਦ ਖੋਹ ਲੈਂਦਾ ਹੈ।'),
     cast:[{who:'priya',mood:'sad'}]},
    {label:L('Talk to Teacher Didi and call Childline 1098.','टीचर दीदी से बात करो और चाइल्डलाइन 1098 पर फ़ोन करो।','ஆசிரியை அக்காவிடம் பேசி சைல்டுலைன் 1098-க்கு அழை.','టీచర్ అక్కతో మాట్లాడి చైల్డ్‌లైన్ 1098కి ఫోన్ చేయి.','ਟੀਚਰ ਦੀਦੀ ਨਾਲ ਗੱਲ ਕਰੋ ਤੇ ਚਾਈਲਡਲਾਈਨ 1098 ’ਤੇ ਫ਼ੋਨ ਕਰੋ।'),ok:true,bg:'school',
     text:L('Didi meets Priya\'s family and explains the law kindly. A Child Marriage Prohibition Officer speaks with them too. The wedding is cancelled and Priya stays in school.','दीदी प्रिया के परिवार से मिलकर क़ानून प्यार से समझाती हैं। बाल विवाह निषेध अधिकारी भी उनसे बात करते हैं। शादी रद्द हो जाती है और प्रिया स्कूल में रहती है।','அக்கா பிரியாவின் குடும்பத்தைச் சந்தித்து சட்டத்தை அன்பாக விளக்குகிறார். குழந்தைத் திருமணத் தடுப்பு அலுவலரும் அவர்களிடம் பேசுகிறார். திருமணம் ரத்தாகிறது, பிரியா பள்ளியில் தொடர்கிறாள்.','అక్క ప్రియ కుటుంబాన్ని కలిసి చట్టాన్ని మృదువుగా వివరిస్తుంది. బాల్య వివాహ నిషేధ అధికారి కూడా వారితో మాట్లాడతారు. పెళ్లి రద్దవుతుంది, ప్రియ బడిలోనే కొనసాగుతుంది.','ਦੀਦੀ ਪ੍ਰੀਆ ਦੇ ਪਰਿਵਾਰ ਨੂੰ ਮਿਲ ਕੇ ਪਿਆਰ ਨਾਲ ਕਾਨੂੰਨ ਸਮਝਾਉਂਦੀ ਹੈ। ਬਾਲ ਵਿਆਹ ਰੋਕੂ ਅਧਿਕਾਰੀ ਵੀ ਉਨ੍ਹਾਂ ਨਾਲ ਗੱਲ ਕਰਦੇ ਨੇ। ਵਿਆਹ ਰੱਦ ਹੋ ਜਾਂਦਾ ਹੈ ਤੇ ਪ੍ਰੀਆ ਸਕੂਲ ਵਿੱਚ ਰਹਿੰਦੀ ਹੈ।'),
     cast:[{who:'didi',mood:'happy'},{who:'maa',mood:'surprised'},{who:'priya',mood:'happy',wave:true}]},
    {label:L('Run away alone at night.','रात को अकेले भाग जाओ।','இரவில் தனியாக ஓடிப்போ.','రాత్రి ఒంటరిగా పారిపో.','ਰਾਤ ਨੂੰ ਇਕੱਲੇ ਭੱਜ ਜਾਓ।'),ok:false,bg:'field',
     text:L('Running away alone is dangerous. A safe adult and Childline can help without Priya being alone on the road.','अकेले भागना ख़तरनाक है। एक सुरक्षित बड़ा और चाइल्डलाइन प्रिया के सड़क पर अकेले हुए बिना मदद कर सकते हैं।','தனியாக ஓடுவது ஆபத்தானது. பிரியா சாலையில் தனியாக இல்லாமலேயே பாதுகாப்பான பெரியவரும் சைல்டுலைனும் உதவ முடியும்.','ఒంటరిగా పారిపోవడం ప్రమాదకరం. ప్రియ రోడ్డుపై ఒంటరిగా లేకుండానే ఒక సురక్షిత పెద్దవాళ్లు, చైల్డ్‌లైన్ సాయం చేయగలరు.','ਇਕੱਲੇ ਭੱਜਣਾ ਖ਼ਤਰਨਾਕ ਹੈ। ਇੱਕ ਸੁਰੱਖਿਅਤ ਵੱਡਾ ਤੇ ਚਾਈਲਡਲਾਈਨ ਪ੍ਰੀਆ ਨੂੰ ਸੜਕ ’ਤੇ ਇਕੱਲੀ ਕੀਤੇ ਬਿਨਾਂ ਮਦਦ ਕਰ ਸਕਦੇ ਨੇ।'),
     cast:[{who:'priya',mood:'worried'}]}
   ]}
 ],
 law:{act:L('Prohibition of Child Marriage Act, 2006','बाल विवाह निषेध अधिनियम, 2006','குழந்தைத் திருமணத் தடைச் சட்டம், 2006','బాల్య వివాహ నిషేధ చట్టం, 2006','ਬਾਲ ਵਿਆਹ ਰੋਕੂ ਐਕਟ, 2006'),
  points:[
   L('The legal age to marry is 18 for girls and 21 for boys.','शादी की क़ानूनी उम्र लड़कियों के लिए 18 और लड़कों के लिए 21 साल है।','திருமணத்துக்கான சட்டப்பூர்வ வயது பெண்களுக்கு 18, ஆண்களுக்கு 21.','పెళ్లికి చట్టబద్ధ వయసు ఆడపిల్లలకు 18, మగపిల్లలకు 21.','ਵਿਆਹ ਦੀ ਕਾਨੂੰਨੀ ਉਮਰ ਕੁੜੀਆਂ ਲਈ 18 ਤੇ ਮੁੰਡਿਆਂ ਲਈ 21 ਸਾਲ ਹੈ।'),
   L('Child marriage is a crime. Those who arrange or help can be punished.','बाल विवाह अपराध है। इसे तय करने या मदद करने वालों को सज़ा हो सकती है।','குழந்தைத் திருமணம் குற்றம். ஏற்பாடு செய்பவர்களும் உதவுபவர்களும் தண்டிக்கப்படலாம்.','బాల్య వివాహం నేరం. ఏర్పాటు చేసేవారికి, సాయం చేసేవారికి శిక్ష పడవచ్చు.','ਬਾਲ ਵਿਆਹ ਅਪਰਾਧ ਹੈ। ਕਰਵਾਉਣ ਜਾਂ ਮਦਦ ਕਰਨ ਵਾਲਿਆਂ ਨੂੰ ਸਜ਼ਾ ਹੋ ਸਕਦੀ ਹੈ।'),
   L('A court can declare a child marriage void, at the choice of the child.','अदालत बच्चे की मर्ज़ी पर बाल विवाह को अमान्य घोषित कर सकती है।','குழந்தையின் விருப்பப்படி நீதிமன்றம் குழந்தைத் திருமணத்தைச் செல்லாததாக அறிவிக்கலாம்.','పిల్లల ఇష్టం మేరకు కోర్టు బాల్య వివాహాన్ని చెల్లనిదిగా ప్రకటించవచ్చు.','ਬੱਚੇ ਦੀ ਮਰਜ਼ੀ ਅਨੁਸਾਰ ਅਦਾਲਤ ਬਾਲ ਵਿਆਹ ਨੂੰ ਰੱਦ ਐਲਾਨ ਸਕਦੀ ਹੈ।'),
   L('Officers and courts can stop a wedding before it happens. Anyone can report, even a child.','अधिकारी और अदालतें शादी होने से पहले उसे रोक सकती हैं। कोई भी, यहाँ तक कि बच्चा भी, शिकायत कर सकता है।','அதிகாரிகளும் நீதிமன்றங்களும் திருமணம் நடக்கும் முன்பே தடுக்க முடியும். யார் வேண்டுமானாலும், குழந்தை கூட, புகார் செய்யலாம்.','అధికారులు, కోర్టులు పెళ్లి జరగకముందే ఆపగలవు. ఎవరైనా, పిల్లలైనా సరే, ఫిర్యాదు చేయవచ్చు.','ਅਧਿਕਾਰੀ ਤੇ ਅਦਾਲਤਾਂ ਵਿਆਹ ਹੋਣ ਤੋਂ ਪਹਿਲਾਂ ਰੋਕ ਸਕਦੇ ਨੇ। ਕੋਈ ਵੀ, ਬੱਚਾ ਵੀ, ਸ਼ਿਕਾਇਤ ਕਰ ਸਕਦਾ ਹੈ।')],
  remember:L('Your future is yours. You can say "not yet".','तुम्हारा भविष्य तुम्हारा है। तुम कह सकती हो "अभी नहीं"।','உன் எதிர்காலம் உனக்குரியது. "இப்போது வேண்டாம்" என்று சொல்லலாம்.','నీ భవిష్యత్తు నీదే. "ఇప్పుడే వద్దు" అని చెప్పవచ్చు.','ਤੁਹਾਡਾ ਭਵਿੱਖ ਤੁਹਾਡਾ ਹੈ। ਤੁਸੀਂ ਕਹਿ ਸਕਦੇ ਹੋ "ਹਾਲੇ ਨਹੀਂ"।'),
  help:[H.sarpanch,H.child,H.police]},
 quiz:[
  {q:L('What is the legal age to marry for girls and boys?','लड़कियों और लड़कों के लिए शादी की क़ानूनी उम्र क्या है?','பெண்கள் மற்றும் ஆண்களுக்குத் திருமணத்துக்கான சட்ட வயது என்ன?','ఆడపిల్లలకు, మగపిల్లలకు పెళ్లికి చట్టబద్ధ వయసు ఎంత?','ਕੁੜੀਆਂ ਤੇ ਮੁੰਡਿਆਂ ਲਈ ਵਿਆਹ ਦੀ ਕਾਨੂੰਨੀ ਉਮਰ ਕੀ ਹੈ?'),o:['16 & 18','18 & 21','15 & 15'],a:1},
  {q:L('Who can report a planned child marriage?','तय हो रहे बाल विवाह की शिकायत कौन कर सकता है?','திட்டமிடப்படும் குழந்தைத் திருமணம் பற்றி யார் புகார் செய்யலாம்?','ప్లాన్ చేస్తున్న బాల్య వివాహం గురించి ఎవరు ఫిర్యాదు చేయవచ్చు?','ਤੈਅ ਹੋ ਰਹੇ ਬਾਲ ਵਿਆਹ ਦੀ ਸ਼ਿਕਾਇਤ ਕੌਣ ਕਰ ਸਕਦਾ ਹੈ?'),
   o:[L('Only police','सिर्फ़ पुलिस','காவல்துறை மட்டும்','పోలీసులు మాత్రమే','ਸਿਰਫ਼ ਪੁਲਿਸ'),L('Only the family','सिर्फ़ परिवार','குடும்பம் மட்டும்','కుటుంబం మాత్రమే','ਸਿਰਫ਼ ਪਰਿਵਾਰ'),L('Anyone, even a child','कोई भी, बच्चा भी','யார் வேண்டுமானாலும், குழந்தையும்','ఎవరైనా, పిల్లలైనా','ਕੋਈ ਵੀ, ਬੱਚਾ ਵੀ')],a:2},

var K=.866;
function pt(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}
function poly(ps,fill,sw,extra){return '<polygon points="'+ps.map(pt).join(' ')+'" fill="'+fill+'" stroke="'+fill+'" stroke-width="'+(sw||8)+'" stroke-linejoin="round" '+(extra||'')+'/>'}
function house(id,s,h,rh,c,done){
  var P0=[0,0],P1=[s*K,-s/2],P2=[-s*K,-s/2],P3=[0,-s];
  var u=function(p){return [p[0],p[1]-h]};
  var A=u(P0),B=u(P1),C=u(P2),D=u(P3),cen=[0,-s/2-h];
  var e=function(p){return [cen[0]+(p[0]-cen[0])*1.16,cen[1]+(p[1]-cen[1])*1.16+8]};
  var E0=e(A),E1=e(B),E2=e(C),E3=e(D),apex=[0,cen[1]-rh];
  var o='';
  o+=poly([P0,P2,C,A],c.l,10)+poly([P0,P1,B,A],c.r,10);
  o+='<polyline points="'+[C,A,B].map(pt).join(' ')+'" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
  var win=function(x,y,w,hh){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+hh+'" rx="6" fill="#fff6cf" stroke="#fff" stroke-width="3"/><path d="M'+(x+w/2)+' '+y+' v'+hh+' M'+x+' '+(y+hh/2)+' h'+w+'" stroke="#f0d98e" stroke-width="2"/>'};
  o+='<g transform="matrix('+(-K)+',-.5,0,1,0,0)">'+win(s*.18,-h*.72,s*.26,h*.32)+win(s*.58,-h*.72,s*.26,h*.32)+'</g>';
  o+='<g transform="matrix('+K+',-.5,0,1,0,0)"><path d="M'+(s*.14)+' 0 v-'+(h*.5)+' a'+(s*.13)+' '+(s*.13)+' 0 0 1 '+(s*.26)+' 0 v'+(h*.5)+'Z" fill="#a85a45" stroke="#fff" stroke-width="3"/>'+win(s*.6,-h*.7,s*.26,h*.32)+'</g>';
  if(id==='labour'){var st='';for(var i=0;i<6;i++){st+='<rect x="'+(s*.05+i*s*.15)+'" y="'+(-h*.58)+'" width="'+(s*.15)+'" height="'+(h*.16)+'" fill="'+(i%2?'#fff6e8':'#ff8470')+'"/>'}o+='<g transform="matrix('+K+',-.5,0,1,0,0)">'+st+'</g>'}
  if(id==='pocso'){o+='<g transform="matrix('+K+',-.5,0,1,0,0)"><path d="M'+(s*.74)+' '+(-h*.28)+' c-'+(s*.12)+' -'+(s*.1)+' -'+(s*.2)+' 0 -'+(s*.1)+' '+(s*.1)+' l'+(s*.1)+' '+(s*.1)+' l'+(s*.1)+' -'+(s*.1)+' c'+(s*.1)+' -'+(s*.1)+' 0 -'+(s*.2)+' -'+(s*.1)+' -'+(s*.1)+'Z" fill="#fff" opacity=".85" transform="translate(0,-14)"/></g>'}
  if(id==='labour'){o+='<rect x="-'+(s*.5)+'" y="'+(cen[1]-rh+10)+'" width="14" height="30" rx="4" fill="#c95f4c" transform="translate(0,0)"/><circle class="steam" cx="-'+(s*.5-7)+'" cy="'+(cen[1]-rh+4)+'" r="7" fill="#fff" opacity=".8" style="--dl:0s"/><circle class="steam" cx="-'+(s*.5-7)+'" cy="'+(cen[1]-rh+4)+'" r="6" fill="#fff" opacity=".8" style="--dl:1.2s"/>'}
  o+=poly([E2,E3,E1,apex],c.rb,8)+poly([E0,E2,apex],c.rl,8)+poly([E0,E1,apex],c.rr,8);
  o+='<polyline points="'+[E2,E0,E1].map(pt).join(' ')+'" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
  if(id==='education'){o+='<line x1="0" y1="'+apex[1]+'" x2="0" y2="'+(apex[1]-46)+'" stroke="#7a5a4a" stroke-width="3" stroke-linecap="round"/><path class="flag" d="M0 '+(apex[1]-46)+' l34 8 l-34 10z" fill="#ff9933"/>'}
  if(id==='marriage'){o+='<circle cx="0" cy="'+(apex[1]-10)+'" r="17" fill="url(#dome)" stroke="#fff3" stroke-width="2"/><rect x="-2" y="'+(apex[1]-40)+'" width="4" height="14" rx="2" fill="#e3a23a"/>'}
  var by=apex[1]-(id==='education'||id==='marriage'?72:46);

   '<g transform="translate(0,'+by+')"><circle class="ring" r="17" fill="none" stroke="#ff8470" stroke-width="3"/><g class="bk"><circle r="17" fill="url(#coralg)" stroke="#fff" stroke-width="3.5"/><path d="M-4.5 -8 L9 0 L-4.5 8Z" fill="#fff"/></g></g>';

function island(r,i,cx,cy,s,h,rh,pal,done,idx){
  var S=s+46,t=18,F=[cx,cy+S/2],R=[cx+S*K,cy],B=[cx,cy-S/2],Lf=[cx-S*K,cy];
  var sh=function(p){return [p[0],p[1]+t]};

  var g='';
  g+=poly([sh(Lf),sh(F),tip],'#c98262',10)+poly([sh(F),sh(R),tip],'#b56c50',10);
  g+=poly([Lf,F,sh(F),sh(Lf)],'#dc9570',8)+poly([F,R,sh(R),sh(F)],'#cb805c',8);

}

function stage(r,bg,prop,cast,dim){

var FACTS=[
 {i:'📘',t:L3("Article 21A of the Constitution makes free education a fundamental right for every child aged 6 to 14.",'संविधान का अनुच्छेद 21A 6 से 14 साल के हर बच्चे को मुफ़्त शिक्षा का मौलिक अधिकार देता है।','ਸੰਵਿਧਾਨ ਦੀ ਧਾਰਾ 21A 6 ਤੋਂ 14 ਸਾਲ ਦੇ ਹਰ ਬੱਚੇ ਨੂੰ ਮੁਫ਼ਤ ਸਿੱਖਿਆ ਦਾ ਮੌਲਿਕ ਹੱਕ ਦਿੰਦੀ ਹੈ।')},
 {i:'📅',t:L3("The Right to Education Act came into force on 1 April 2010.",'शिक्षा का अधिकार क़ानून 1 अप्रैल 2010 से लागू हुआ।','ਸਿੱਖਿਆ ਦਾ ਅਧਿਕਾਰ ਕਾਨੂੰਨ 1 ਅਪ੍ਰੈਲ 2010 ਤੋਂ ਲਾਗੂ ਹੋਇਆ।')},
 {i:'📞',t:L3("Childline 1098 is free and answers 24 hours a day, every day.",'चाइल्डलाइन 1098 मुफ़्त है और हर दिन 24 घंटे जवाब देती है।','ਚਾਈਲਡਲਾਈਨ 1098 ਮੁਫ਼ਤ ਹੈ ਅਤੇ ਹਰ ਦਿਨ 24 ਘੰਟੇ ਜਵਾਬ ਦਿੰਦੀ ਹੈ।')},
 {i:'🛡️',t:L3("The POCSO Act of 2012 protects every child under 18, boys and girls. It is never the child's fault.",'POCSO क़ानून 2012 हर 18 साल से छोटे बच्चे की सुरक्षा करता है, लड़कों और लड़कियों दोनों की। इसमें बच्चे की कभी ग़लती नहीं होती।','POCSO ਕਾਨੂੰਨ 2012 ਹਰ 18 ਸਾਲ ਤੋਂ ਛੋਟੇ ਬੱਚੇ ਦੀ ਸੁਰੱਖਿਆ ਕਰਦਾ ਹੈ, ਮੁੰਡਿਆਂ ਅਤੇ ਕੁੜੀਆਂ ਦੋਵਾਂ ਦੀ। ਇਸ ਵਿੱਚ ਬੱਚੇ ਦੀ ਕਦੇ ਗ਼ਲਤੀ ਨਹੀਂ ਹੁੰਦੀ।')},
 {i:'💍',t:L3("The legal age to marry in India is 18 for girls and 21 for boys.",'भारत में शादी की क़ानूनी उम्र लड़कियों के लिए 18 और लड़कों के लिए 21 साल है।','ਭਾਰਤ ਵਿੱਚ ਵਿਆਹ ਦੀ ਕਾਨੂੰਨੀ ਉਮਰ ਕੁੜੀਆਂ ਲਈ 18 ਅਤੇ ਮੁੰਡਿਆਂ ਲਈ 21 ਸਾਲ ਹੈ।')},
 {i:'🚫',t:L3("Children under 14 cannot be employed in any job, and teens under 18 cannot do dangerous work.",'14 साल से छोटे बच्चों को किसी भी काम पर नहीं रखा जा सकता, और 18 साल से छोटे किशोर ख़तरनाक काम नहीं कर सकते।','14 ਸਾਲ ਤੋਂ ਛੋਟੇ ਬੱਚਿਆਂ ਨੂੰ ਕਿਸੇ ਵੀ ਕੰਮ ਤੇ ਨਹੀਂ ਰੱਖਿਆ ਜਾ ਸਕਦਾ, ਅਤੇ 18 ਸਾਲ ਤੋਂ ਛੋਟੇ ਕਿਸ਼ੋਰ ਖ਼ਤਰਨਾਕ ਕੰਮ ਨਹੀਂ ਕਰ ਸਕਦੇ।')},
 {i:'🌍',t:L3("12 June is World Day Against Child Labour.",'12 जून विश्व बाल श्रम निषेध दिवस है।','12 ਜੂਨ ਵਿਸ਼ਵ ਬਾਲ ਮਜ਼ਦੂਰੀ ਵਿਰੋਧੀ ਦਿਵਸ ਹੈ।')},
 {i:'🎈',t:L3("India celebrates Children's Day on 14 November, the birthday of Jawaharlal Nehru.",'भारत में 14 नवंबर को बाल दिवस मनाया जाता है, जो जवाहरलाल नेहरू का जन्मदिन है।','ਭਾਰਤ ਵਿੱਚ 14 ਨਵੰਬਰ ਨੂੰ ਬਾਲ ਦਿਵਸ ਮਨਾਇਆ ਜਾਂਦਾ ਹੈ, ਜੋ ਜਵਾਹਰਲਾਲ ਨਹਿਰੂ ਦਾ ਜਨਮ ਦਿਨ ਹੈ।')},
 {i:'🌐',t:L3("The UN Convention on the Rights of the Child was adopted on 20 November 1989, and India agreed to follow it in 1992.",'बाल अधिकारों पर संयुक्त राष्ट्र कन्वेंशन 20 नवंबर 1989 को अपनाया गया, और भारत ने 1992 में इसे मानने की सहमति दी।','ਬਾਲ ਅਧਿਕਾਰਾਂ ਬਾਰੇ ਸੰਯੁਕਤ ਰਾਸ਼ਟਰ ਕਨਵੈਨਸ਼ਨ 20 ਨਵੰਬਰ 1989 ਨੂੰ ਅਪਣਾਈ ਗਈ, ਅਤੇ ਭਾਰਤ ਨੇ 1992 ਵਿੱਚ ਇਸਨੂੰ ਮੰਨਣ ਦੀ ਸਹਿਮਤੀ ਦਿੱਤੀ।')},
 {i:'🏅',t:L3("Kailash Satyarthi, who has worked to free children from labour, shared the 2014 Nobel Peace Prize with Malala Yousafzai.",'बच्चों को मज़दूरी से मुक्त कराने वाले कैलाश सत्यार्थी ने 2014 का नोबेल शांति पुरस्कार मलाला यूसुफ़ज़ई के साथ साझा किया।','ਬੱਚਿਆਂ ਨੂੰ ਮਜ਼ਦੂਰੀ ਤੋਂ ਛੁਡਾਉਣ ਲਈ ਕੰਮ ਕਰਨ ਵਾਲੇ ਕੈਲਾਸ਼ ਸਤਿਆਰਥੀ ਨੇ 2014 ਦਾ ਨੋਬਲ ਸ਼ਾਂਤੀ ਪੁਰਸਕਾਰ ਮਲਾਲਾ ਯੂਸਫ਼ਜ਼ਈ ਨਾਲ ਸਾਂਝਾ ਕੀਤਾ।')},
 {i:'🪪',t:L3("A birth certificate proves your age. That helps protect you from child marriage and child labour.",'जन्म प्रमाणपत्र आपकी उम्र साबित करता है। इससे बाल विवाह और बाल मज़दूरी से बचाव में मदद मिलती है।','ਜਨਮ ਸਰਟੀਫ਼ਿਕੇਟ ਤੁਹਾਡੀ ਉਮਰ ਸਾਬਤ ਕਰਦਾ ਹੈ। ਇਹ ਬਾਲ ਵਿਆਹ ਅਤੇ ਬਾਲ ਮਜ਼ਦੂਰੀ ਤੋਂ ਬਚਾਅ ਵਿੱਚ ਮਦਦ ਕਰਦਾ ਹੈ।')},
 {i:'⚖️',t:L3("Free legal help is available for children through NALSA. Call 15100.",'NALSA के ज़रिए बच्चों को मुफ़्त क़ानूनी मदद मिलती है। 15100 पर फ़ोन करें।','NALSA ਰਾਹੀਂ ਬੱਚਿਆਂ ਨੂੰ ਮੁਫ਼ਤ ਕਾਨੂੰਨੀ ਮਦਦ ਮਿਲਦੀ ਹੈ। 15100 ਤੇ ਫ਼ੋਨ ਕਰੋ।')},
 {i:'🏫',t:L3("Under the RTE Act, private schools must keep 25% of their entry-level seats free for children from poorer families.",'RTE क़ानून के तहत निजी स्कूलों को प्रवेश कक्षा की 25% सीटें ग़रीब परिवारों के बच्चों के लिए मुफ़्त रखनी होती हैं।','RTE ਕਾਨੂੰਨ ਅਧੀਨ ਪ੍ਰਾਈਵੇਟ ਸਕੂਲਾਂ ਨੂੰ ਦਾਖ਼ਲਾ ਜਮਾਤ ਦੀਆਂ 25% ਸੀਟਾਂ ਗ਼ਰੀਬ ਪਰਿਵਾਰਾਂ ਦੇ ਬੱਚਿਆਂ ਲਈ ਮੁਫ਼ਤ ਰੱਖਣੀਆਂ ਪੈਂਦੀਆਂ ਹਨ।')},
 {i:'🍛',t:L3("The school meal programme, now called PM POSHAN, is one of the largest in the world.",'स्कूलों में भोजन की योजना, जिसे अब PM पोषण कहते हैं, दुनिया की सबसे बड़ी योजनाओं में से एक है।','ਸਕੂਲਾਂ ਵਿੱਚ ਭੋਜਨ ਦੀ ਯੋਜਨਾ, ਜਿਸਨੂੰ ਹੁਣ PM ਪੋਸ਼ਣ ਕਹਿੰਦੇ ਹਨ, ਦੁਨੀਆ ਦੀਆਂ ਸਭ ਤੋਂ ਵੱਡੀਆਂ ਯੋਜਨਾਵਾਂ ਵਿੱਚੋਂ ਇੱਕ ਹੈ।')},
 {i:'🏭',t:L3("Article 24 of the Constitution says no child below 14 may work in a factory, a mine or any dangerous job.",'संविधान का अनुच्छेद 24 कहता है कि 14 साल से छोटा कोई बच्चा कारख़ाने, खदान या किसी ख़तरनाक काम में नहीं लगाया जा सकता।','ਸੰਵਿਧਾਨ ਦੀ ਧਾਰਾ 24 ਕਹਿੰਦੀ ਹੈ ਕਿ 14 ਸਾਲ ਤੋਂ ਛੋਟਾ ਕੋਈ ਬੱਚਾ ਕਾਰਖ਼ਾਨੇ, ਖਾਣ ਜਾਂ ਕਿਸੇ ਖ਼ਤਰਨਾਕ ਕੰਮ ਵਿੱਚ ਨਹੀਂ ਲਾਇਆ ਜਾ ਸਕਦਾ।')}

var mapSel=null,factIdx=null;

function tileIdx(code){for(var i=0;i<TILES.length;i++)if(TILES[i][0]===code)return i;return -1}
function mapInfo(){
  if(!mapSel)return '<div class="mi0">👆 '+esc(t('mapTap'))+'</div>';
  var i=tileIdx(mapSel),x=TILES[i],f=TFACT[x[0]],txt=f?T(f):T(FACTS[(i*5+2)%FACTS.length].t);
  return '<div class="mi" data-r="'+x[3]+'"><div class="mic tl" data-r="'+x[3]+'" style="aspect-ratio:auto;opacity:1;border-radius:50%">'+x[0]+'</div><div class="mt"><h3>'+esc(T(x[4]))+'</h3><span class="tag">'+(f?'':'🇮🇳 ')+esc(t(f?'tagState':'tagIndia'))+'</span><p id="mtxt">'+esc(txt)+'</p></div><button class="btn sm alt" data-x="speakmap" aria-label="'+esc(t('listen'))+'">'+esc(t('listen'))+'</button></div>';
}
function mapHTML(){
  return '<section class="mapsec glass" aria-label="'+esc(t('mapT'))+'"><div class="mhead"><div><h2>🗺️ '+esc(t('mapT'))+'</h2><p>'+esc(t('mapSub'))+'</p></div><span class="tag" id="mapCount">'+esc(t('mapExp',{a:cnt(social.tiles),b:TILES.length}))+'</span></div>'+
  '<div class="tmap" role="group" aria-label="'+esc(t('mapT'))+'">'+TILES.map(function(x){
    return '<button class="tl'+(social.tiles[x[0]]?' seen':'')+(mapSel===x[0]?' sel':'')+'" data-tile="'+x[0]+'" data-r="'+x[3]+'" style="grid-column:'+(x[1]+1)+';grid-row:'+(x[2]+1)+'" aria-label="'+esc(T(x[4]))+'">'+x[0]+'</button>'}).join('')+'</div>'+
  '<div class="minfo" id="minfo" aria-live="polite">'+mapInfo()+'</div><p class="fine" style="text-align:center">'+esc(t('mapNote'))+'</p></section>';
}
function pickTile(code){
  mapSel=code;social.tiles[code]=1;saveSocial();
  app.querySelectorAll('.tl[data-tile]').forEach(function(b){var on=b.dataset.tile===code;b.classList.toggle('sel',on);if(on)b.classList.add('seen')});
  var mi=$('#minfo');if(mi)mi.innerHTML=mapInfo();
  var mc=$('#mapCount');if(mc)mc.textContent=t('mapExp',{a:cnt(social.tiles),b:TILES.length});
  sfx('pop');checkBadges(true);
}

function factHTML(){
  if(factIdx===null)factIdx=Math.floor(Date.now()/864e5)%FACTS.length;
  social.facts[factIdx]=1;saveSocial();
  var f=FACTS[factIdx];
  return '<section class="fsec clay fcard" id="fcard"><div class="fic" id="fic" aria-hidden="true">'+f.i+'</div><div><h3>'+esc(t('factT'))+'</h3><p class="ftxt" id="ftxt" aria-live="polite">'+esc(T(f.t))+'</p>'+
  '<div class="row" style="justify-content:flex-start;align-items:center"><button class="btn sun sm" data-x="fact">'+esc(t('factBtn'))+'</button><button class="btn alt sm" data-x="speakfact">'+esc(t('listen'))+'</button><span class="tag" id="fcount">'+esc(t('factSeen',{a:cnt(social.facts),b:FACTS.length}))+'</span></div></div></section>';
}
function nextFact(){
  var all=FACTS.map(function(_,i){return i}),unseen=all.filter(function(i){return !social.facts[i]}),pool=(unseen.length?unseen:all).filter(function(i){return i!==factIdx});
  if(!pool.length)pool=all.filter(function(i){return i!==factIdx});
  factIdx=pool[Math.floor(Math.random()*pool.length)];social.facts[factIdx]=1;saveSocial();
  var c=$('#fcard');if(!c)return;c.classList.remove('flip');void c.offsetWidth;c.classList.add('flip');
  setTimeout(function(){var a=$('#fic'),b=$('#ftxt');if(a)a.textContent=FACTS[factIdx].i;if(b)b.textContent=T(FACTS[factIdx].t);var n=$('#fcount');if(n)n.textContent=t('factSeen',{a:cnt(social.facts),b:FACTS.length})},230);
  sfx('whoosh');checkBadges(true);
}

/* ---- progress as a compact digit string, one digit (0-3 stars) per right ---- */
var RIDS=RIGHTS.map(function(r){return r.id});
function progressDigits(){return RIGHTS.map(function(r){var d=progress.done[r.id];return d?String(Math.min(3,Math.max(1,d.stars||1))):'0'}).join('')}
function statFromS(s){
  var n=0,stars=0,three=0;for(var i=0;i<s.length;i++){var v=+s.charAt(i)||0;if(v>0)n++;stars+=v;if(v===3)three++}
  return {n:n,stars:stars,three:three,has:function(id){var i=RIDS.indexOf(id);return i>=0&&(+s.charAt(i)||0)>0},tiles:0,facts:0,langs:0,profile:false,help:false};
}
function meStat(){var st=statFromS(progressDigits());st.tiles=cnt(social.tiles);st.facts=cnt(social.facts);st.langs=cnt(social.langs);st.profile=!!social.me;st.help=!!social.flags.help;return st}

var AV=['🦁','🐯','🐼','🦊','🐸','🐧','🦄','🐢','🦋','🐬','🐘','🌻','🚀','⚽','🎨','🌈'];

function cleanName(n){return Array.from(String(n||'').replace(/[\u0000-\u001f|<>&"'\\]/g,'').trim()).slice(0,14).join('')}
function encCode(name,av,s){try{return 'SKM1.'+btoa(unescape(encodeURIComponent(name+'|'+av+'|'+s)))}catch(e){return ''}}
function decCode(code){
  try{
    code=String(code||'').replace(/\s+/g,'');if(code.indexOf('SKM1.')!==0)return null;
    var p=decodeURIComponent(escape(atob(code.slice(5)))).split('|');if(p.length!==3)return null;
    var name=cleanName(p[0]);if(!name)return null;
    var av=AV.indexOf(p[1])>=0?p[1]:'🙂',s=/^[0-3]*$/.test(p[2])?p[2]:'';
    while(s.length<RIDS.length)s+='0';s=s.slice(0,RIDS.length);
    return {id:'c'+hash(name+'|'+av),name:name,av:av,s:s};
  }catch(e){return null}
}
function hash(str){var h=5381;for(var i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))|0;return (h>>>0).toString(36)}
function syncMe(){
  if(!social.me)return;
  var o={id:'me',name:social.me.name,av:social.me.av,s:progressDigits()},i=-1;
  social.roster.forEach(function(x,k){if(x.id==='me')i=k});
  if(i<0)social.roster.unshift(o);else social.roster[i]=o;
  saveSocial();
}
function badgesOf(st,isMe){return BADGES.filter(function(b){return (isMe||b.p)&&b.ok(st)})}

  h+='<div style="margin-top:14px"><b>'+esc(t('addCode'))+'</b><textarea class="fld" id="codein" rows="2" spellcheck="false" placeholder="SKM1.…" aria-label="'+esc(t('addCode'))+'"></textarea></div>'+

function demoClass(){
  var names=[['Sher','🦁',30],['Chhotu','🐼',24],['Meena','🦋',19],['Tiger','🐯',15],['Lotus','🌻',11],['Rocket','🚀',8],['Pari','🦄',5],['Dolphin','🐬',2]],seed=7;
  function rnd(){seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff}
  return names.map(function(x){var order=RIDS.map(function(_,i){return i}).sort(function(){return rnd()-.5}),s=RIDS.map(function(){return '0'});
    for(var k=0;k<Math.min(x[2],RIDS.length);k++)s[order[k]]=String(1+Math.floor(rnd()*3));
    return {id:'demo-'+x[0],name:x[0],av:x[1],s:s.join(''),demo:true}});
}
function csvCell(v){v=String(v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}
function exportCsv(){
  var rows=[['Nickname','Rights completed','Total stars'].concat(RIGHTS.map(function(r){return (r.title&&r.title.en)||r.id}))];
  social.roster.forEach(function(x){var st=statFromS(x.s);rows.push([x.name,st.n,st.stars].concat(RIDS.map(function(_,i){return +x.s.charAt(i)||0})))});
  var csv='\ufeff'+rows.map(function(r){return r.map(csvCell).join(',')}).join('\r\n');
  try{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='saksham-class.csv';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}catch(e){}
}

app.addEventListener('click',function(e){
  var b=e.target.closest('[data-x],[data-tile],[data-av]');if(!b)return;
  if(b.dataset.tile){pickTile(b.dataset.tile);return}
  if(b.dataset.av!==undefined){commAv=b.dataset.av;app.querySelectorAll('.avb').forEach(function(x){x.setAttribute('aria-pressed',x.dataset.av===commAv)});sfx('pop');return}
  switch(b.dataset.x){
    case 'fact':nextFact();break;
    case 'speakfact':var f=$('#ftxt');if(f)speak(f.textContent);break;
    case 'speakmap':var m=$('#mtxt');if(m)speak(m.textContent);break;
    case 'saveme':
      var nm=cleanName($('#nick').value),msg=$('#nickmsg');
      if(!nm){msg.textContent=t('nickEmpty');break}
      if(/\d{5,}/.test(nm.replace(/[\s-]/g,''))){msg.textContent=t('nickBad');break}
      social.me={name:nm,av:commAv||AV[0]};saveSocial();syncMe();var gb=checkBadges(true);ttOpen=false;community();if(!gb.length)toast(t('savedOk'));break;
    case 'copycode':var c=$('#mycode');if(c&&navigator.clipboard)navigator.clipboard.writeText(c.textContent).then(function(){b.textContent=t('copied')}).catch(function(){});break;
    case 'addcode':
      var st=decCode($('#codein').value);
      if(!st){$('#tmsg').textContent=t('badCode');break}
      if(social.me&&st.name===social.me.name&&st.av===social.me.av)st.id='me'; /* your own code: update your card, no duplicate */
      var at=-1;social.roster.forEach(function(x,i){if(x.id===st.id)at=i});
      if(at<0)social.roster.push(st);else social.roster[at]=st;
      saveSocial();ttOpen=true;tmsg=t('addedOk');community();break;
    case 'rm':social.roster=social.roster.filter(function(x){return x.id!==b.dataset.id});saveSocial();ttOpen=true;community();break;
    case 'demo':
      if(social.roster.some(function(x){return x.demo}))social.roster=social.roster.filter(function(x){return !x.demo});
      else social.roster=social.roster.concat(demoClass());
      saveSocial();ttOpen=true;community();break;
    case 'csv':exportCsv();break;
  }
});

var SYSTEM='You are Gyani, a kind, calm owl who guides children aged 8 to 16 in India inside SAKSHAM, an app about child rights. '+
'RULES: Use simple, short, warm words (under 90 words). Never be scary or graphic. Share general information only about these Indian laws and be honest that you are not a lawyer: '+
'(1) Right to Education Act 2009 / Article 21A: free and compulsory education for ages 6 to 14, no fees in government schools for elementary education, a child cannot be thrown out before class 8, 25% free seats in private schools for poorer children, no beating as punishment. '+
'(2) Child and Adolescent Labour (Prohibition and Regulation) Act: no employment of children below 14; teens 14 to 18 cannot do dangerous work; employers can be jailed 6 months to 2 years and/or fined Rs 20,000 to 50,000; children are protected, not punished; helping family in safe work after school is allowed. '+
'(3) POCSO Act 2012: protects every child under 18, boys and girls; it is NEVER the child\'s fault; anyone who knows must report; identity is kept secret; child-friendly police and courts. '+
'(4) Prohibition of Child Marriage Act 2006: marriage age is 18 for girls and 21 for boys; child marriage is a crime and can be stopped or declared void; anyone can report. '+
'HELP: If the child describes being hurt, touched in an unsafe way, forced to work or marry, or feeling unsafe: tell them clearly it is not their fault, they should tell a trusted adult now (parent, teacher, relative; if one does not listen, tell another), and can call Childline 1098 (free, 24 hours) or 112 in an emergency; legal aid helpline NALSA 15100. '+
'Never ask for the child\'s name, school, address, phone number or photos. If asked about something unrelated to child rights or safety, answer briefly and kindly steer back.';
var FAQ=[
 [/pocso|touch|abus|uncle|secret|unsafe|bad touch|छू|राज़|डर|தொட|ரகசிய|பயம்|తాక|రహస్య|భయం|ਛੂ|ਭੇਤ|ਡਰ/i,
  L('It is NEVER your fault if someone touches you in a way that feels wrong or scary. Your body belongs to you. Tell a grown-up you trust right now. If they do not listen, tell another. The POCSO law protects every child under 18. Call Childline 1098, it is free.','अगर कोई तुम्हें ऐसे छुए जो ग़लत या डरावना लगे तो यह कभी तुम्हारी ग़लती नहीं है। तुम्हारा शरीर तुम्हारा है। अभी किसी भरोसेमंद बड़े को बताओ। वे न सुनें तो किसी और को बताओ। पॉक्सो क़ानून 18 से कम हर बच्चे की रक्षा करता है। चाइल्डलाइन 1098 पर फ़ोन करो, यह मुफ़्त है।','யாராவது உன்னை தவறாக அல்லது பயமாக உணரும்படி தொட்டால் அது ஒருபோதும் உன் தவறு அல்ல. உன் உடல் உனக்குச் சொந்தம். இப்போதே நம்பகமான பெரியவரிடம் சொல். அவர் கேட்காவிட்டால் வேறொருவரிடம் சொல். போக்சோ சட்டம் 18 வயதுக்குக் கீழ் உள்ள ஒவ்வொரு குழந்தையையும் பாதுகாக்கிறது. சைல்டுலைன் 1098-க்கு இலவசமாக அழை.','ఎవరైనా నిన్ను తప్పుగా లేదా భయంగా అనిపించేలా తాకితే అది ఎప్పుడూ నీ తప్పు కాదు. నీ శరీరం నీదే. ఇప్పుడే నమ్మకమైన పెద్దవాళ్లకు చెప్పు. వాళ్లు వినకపోతే మరొకరికి చెప్పు. పోక్సో చట్టం 18 ఏళ్ల లోపు ప్రతి బిడ్డను కాపాడుతుంది. చైల్డ్‌లైన్ 1098కి ఉచితంగా ఫోన్ చేయి.','ਜੇ ਕੋਈ ਤੁਹਾਨੂੰ ਗ਼ਲਤ ਜਾਂ ਡਰਾਉਣੇ ਢੰਗ ਨਾਲ ਛੂਹੇ ਤਾਂ ਇਹ ਕਦੇ ਤੁਹਾਡੀ ਗ਼ਲਤੀ ਨਹੀਂ। ਤੁਹਾਡਾ ਸਰੀਰ ਤੁਹਾਡਾ ਹੈ। ਹੁਣੇ ਕਿਸੇ ਭਰੋਸੇਮੰਦ ਵੱਡੇ ਨੂੰ ਦੱਸੋ। ਉਹ ਨਾ ਸੁਣਨ ਤਾਂ ਕਿਸੇ ਹੋਰ ਨੂੰ ਦੱਸੋ। ਪੋਕਸੋ ਕਾਨੂੰਨ 18 ਸਾਲ ਤੋਂ ਘੱਟ ਹਰ ਬੱਚੇ ਦੀ ਰਾਖੀ ਕਰਦਾ ਹੈ। ਚਾਈਲਡਲਾਈਨ 1098 ’ਤੇ ਮੁਫ਼ਤ ਫ਼ੋਨ ਕਰੋ।')],
 [/marri|shaadi|shadi|wedding|byah|vivah|शादी|विवाह|திருமண|పెళ్లి|వివాహ|ਵਿਆਹ/i,
  L('The legal age to marry is 18 for girls and 21 for boys. Child marriage is a crime and can be stopped. If a wedding is planned for a child, tell a teacher or call Childline 1098. Anyone can report it.','शादी की क़ानूनी उम्र लड़कियों के लिए 18 और लड़कों के लिए 21 है। बाल विवाह अपराध है और रोका जा सकता है। किसी बच्चे की शादी तय हो तो शिक्षक को बताओ या 1098 पर फ़ोन करो। कोई भी शिकायत कर सकता है।','திருமண வயது பெண்களுக்கு 18, ஆண்களுக்கு 21. குழந்தைத் திருமணம் குற்றம், அதைத் தடுக்கலாம். ஒரு குழந்தைக்குத் திருமணம் திட்டமிடப்பட்டால் ஆசிரியரிடம் சொல் அல்லது 1098-க்கு அழை. யார் வேண்டுமானாலும் புகார் செய்யலாம்.','పెళ్లి వయసు ఆడపిల్లలకు 18, మగపిల్లలకు 21. బాల్య వివాహం నేరం, దాన్ని ఆపవచ్చు. ఒక బిడ్డకు పెళ్లి ప్లాన్ చేస్తే ఉపాధ్యాయులకు చెప్పు లేదా 1098కి ఫోన్ చేయి. ఎవరైనా ఫిర్యాదు చేయవచ్చు.','ਵਿਆਹ ਦੀ ਕਾਨੂੰਨੀ ਉਮਰ ਕੁੜੀਆਂ ਲਈ 18 ਤੇ ਮੁੰਡਿਆਂ ਲਈ 21 ਹੈ। ਬਾਲ ਵਿਆਹ ਅਪਰਾਧ ਹੈ ਤੇ ਰੋਕਿਆ ਜਾ ਸਕਦਾ ਹੈ। ਜੇ ਕਿਸੇ ਬੱਚੇ ਦਾ ਵਿਆਹ ਤੈਅ ਹੋਵੇ ਤਾਂ ਅਧਿਆਪਕ ਨੂੰ ਦੱਸੋ ਜਾਂ 1098 ’ਤੇ ਫ਼ੋਨ ਕਰੋ। ਕੋਈ ਵੀ ਸ਼ਿਕਾਇਤ ਕਰ ਸਕਦਾ ਹੈ।')],
 [/work|labou?r|job|dhaba|wage|salary|paid|kaam|काम|मज़दूरी|வேலை|సంపాదన|పని|ਕੰਮ|ਮਜ਼ਦੂਰੀ/i,
  L('Children below 14 cannot be employed in any job. Teens 14 to 18 cannot do dangerous work. The employer can be punished, not the child. If you or a friend is made to work, call Childline 1098.','14 साल से छोटे बच्चों को किसी काम पर नहीं रखा जा सकता। 14 से 18 साल के किशोर ख़तरनाक काम नहीं कर सकते। सज़ा मालिक को हो सकती है, बच्चे को नहीं। तुम्हें या दोस्त को काम पर लगाया जाए तो 1098 पर फ़ोन करो।','14 வயதுக்குக் கீழ் உள்ளவர்களை எந்த வேலையிலும் அமர்த்தக் கூடாது. 14 முதல் 18 வயதினர் ஆபத்தான வேலை செய்யக் கூடாது. தண்டனை உரிமையாளருக்கே, குழந்தைக்கு அல்ல. உனக்கோ நண்பனுக்கோ வேலை செய்ய நிர்பந்தம் இருந்தால் 1098-க்கு அழை.','14 ఏళ్ల లోపు పిల్లలను ఏ పనిలోనూ పెట్టుకోకూడదు. 14 నుంచి 18 ఏళ్ల వారు ప్రమాదకర పనులు చేయకూడదు. శిక్ష యజమానికే, పిల్లలకు కాదు. నీతో లేదా స్నేహితుడితో పని చేయిస్తుంటే 1098కి ఫోన్ చేయి.','14 ਸਾਲ ਤੋਂ ਛੋਟੇ ਬੱਚਿਆਂ ਨੂੰ ਕਿਸੇ ਕੰਮ ’ਤੇ ਨਹੀਂ ਰੱਖਿਆ ਜਾ ਸਕਦਾ। 14 ਤੋਂ 18 ਸਾਲ ਦੇ ਕਿਸ਼ੋਰ ਖ਼ਤਰਨਾਕ ਕੰਮ ਨਹੀਂ ਕਰ ਸਕਦੇ। ਸਜ਼ਾ ਮਾਲਕ ਨੂੰ ਹੋ ਸਕਦੀ ਹੈ, ਬੱਚੇ ਨੂੰ ਨਹੀਂ। ਤੁਹਾਡੇ ਜਾਂ ਦੋਸਤ ਤੋਂ ਕੰਮ ਕਰਵਾਇਆ ਜਾਵੇ ਤਾਂ 1098 ’ਤੇ ਫ਼ੋਨ ਕਰੋ।')],
 [/school|educat|fee|study|padh|class|teacher|स्कूल|पढ़|फ़ीस|பள்ளி|கல்வி|బడి|పాఠశాల|చదువు|ਸਕੂਲ|ਪੜ੍ਹ|ਫ਼ੀਸ/i,
  L('Every child from 6 to 14 has the right to free education. Government schools cannot charge fees for elementary classes, and a child cannot be thrown out before class 8. Talk to your teacher if there is a problem.','6 से 14 साल के हर बच्चे को मुफ़्त शिक्षा का अधिकार है। सरकारी स्कूल प्रारंभिक कक्षाओं की फ़ीस नहीं ले सकते और आठवीं से पहले किसी बच्चे को निकाला नहीं जा सकता। कोई समस्या हो तो शिक्षक से बात करो।','6 முதல் 14 வயது வரை ஒவ்வொரு குழந்தைக்கும் இலவசக் கல்வி உரிமை உண்டு. அரசுப் பள்ளிகள் தொடக்கக் கல்விக்குக் கட்டணம் வாங்கக் கூடாது; 8-ஆம் வகுப்புக்கு முன் குழந்தையை வெளியேற்றக் கூடாது. பிரச்சினை இருந்தால் ஆசிரியரிடம் பேசு.','6 నుంచి 14 ఏళ్ల ప్రతి బిడ్డకు ఉచిత విద్య హక్కు ఉంది. ప్రభుత్వ బడులు ప్రాథమిక తరగతులకు ఫీజు తీసుకోకూడదు, 8వ తరగతికి ముందు బిడ్డను బయటకు పంపకూడదు. సమస్య ఉంటే ఉపాధ్యాయులతో మాట్లాడు.','6 ਤੋਂ 14 ਸਾਲ ਦੇ ਹਰ ਬੱਚੇ ਨੂੰ ਮੁਫ਼ਤ ਸਿੱਖਿਆ ਦਾ ਹੱਕ ਹੈ। ਸਰਕਾਰੀ ਸਕੂਲ ਮੁੱਢਲੀਆਂ ਜਮਾਤਾਂ ਦੀ ਫ਼ੀਸ ਨਹੀਂ ਲੈ ਸਕਦੇ ਤੇ ਅੱਠਵੀਂ ਤੋਂ ਪਹਿਲਾਂ ਬੱਚੇ ਨੂੰ ਕੱਢਿਆ ਨਹੀਂ ਜਾ ਸਕਦਾ। ਕੋਈ ਸਮੱਸਿਆ ਹੋਵੇ ਤਾਂ ਅਧਿਆਪਕ ਨਾਲ ਗੱਲ ਕਰੋ।')],
 [/1098|childline|help|call|number|madad|police|112|lawyer|legal|मदद|உதவி|సహాయం|ਮਦਦ/i,
  L('Free numbers: Childline 1098 (24 hours), Emergency 112, NALSA legal aid 15100. You can also tap the red Help button on any screen.','मुफ़्त नंबर: चाइल्डलाइन 1098 (24 घंटे), आपातकाल 112, NALSA क़ानूनी मदद 15100। किसी भी स्क्रीन पर लाल मदद बटन भी दबा सकते हो।','இலவச எண்கள்: சைல்டுலைன் 1098 (24 மணி), அவசரம் 112, NALSA சட்ட உதவி 15100. எந்தத் திரையிலும் சிவப்பு உதவி பொத்தானையும் தொடலாம்.','ఉచిత నంబర్లు: చైల్డ్‌లైన్ 1098 (24 గంటలు), అత్యవసరం 112, NALSA న్యాయ సహాయం 15100. ఏ స్క్రీన్‌లోనైనా ఎరుపు సహాయం బటన్ నొక్కవచ్చు.','ਮੁਫ਼ਤ ਨੰਬਰ: ਚਾਈਲਡਲਾਈਨ 1098 (24 ਘੰਟੇ), ਐਮਰਜੈਂਸੀ 112, NALSA ਕਾਨੂੰਨੀ ਮਦਦ 15100। ਕਿਸੇ ਵੀ ਸਕ੍ਰੀਨ ’ਤੇ ਲਾਲ ਮਦਦ ਬਟਨ ਵੀ ਦਬਾ ਸਕਦੇ ਹੋ।')],
 [/\bhi\b|hello|hey|namaste|नमस्ते|வணக்கம்|నమస్తే|ਸਤ ਸ੍ਰੀ/i,
  L('Hoo-hoo! I am Gyani the owl. Ask me about school, work, staying safe or marriage. 🦉','हू-हू! मैं उल्लू ज्ञानी हूँ। मुझसे स्कूल, काम, सुरक्षा या शादी के बारे में पूछो। 🦉','ஹூ-ஹூ! நான் ஆந்தை ஞானி. பள்ளி, வேலை, பாதுகாப்பு, திருமணம் பற்றி என்னிடம் கேள். 🦉','హూ-హూ! నేను గుడ్లగూబ జ్ఞానిని. బడి, పని, భద్రత, పెళ్లి గురించి అడుగు. 🦉','ਹੂ-ਹੂ! ਮੈਂ ਉੱਲੂ ਗਿਆਨੀ ਹਾਂ। ਮੈਨੂੰ ਸਕੂਲ, ਕੰਮ, ਸੁਰੱਖਿਆ ਜਾਂ ਵਿਆਹ ਬਾਰੇ ਪੁੱਛੋ। 🦉')]
];
var DEFAULT_A=L('Good question! I know about school rights, child labour, staying safe from abuse (POCSO) and child marriage. Try asking about one of them. If you ever feel unsafe, tell a grown-up you trust or call 1098.','अच्छा सवाल! मुझे स्कूल के अधिकार, बाल श्रम, दुर्व्यवहार से सुरक्षा (पॉक्सो) और बाल विवाह के बारे में पता है। इनमें से किसी के बारे में पूछो। असुरक्षित लगे तो किसी भरोसेमंद बड़े को बताओ या 1098 पर फ़ोन करो।','நல்ல கேள்வி! பள்ளி உரிமைகள், குழந்தைத் தொழிலாளர், துன்புறுத்தலிலிருந்து பாதுகாப்பு (போக்சோ), குழந்தைத் திருமணம் பற்றி எனக்குத் தெரியும். இவற்றில் ஒன்றைப் பற்றிக் கேள். பாதுகாப்பற்றதாக உணர்ந்தால் நம்பகமான பெரியவரிடம் சொல் அல்லது 1098-க்கு அழை.','మంచి ప్రశ్న! నాకు బడి హక్కులు, బాల కార్మికత, వేధింపుల నుంచి రక్షణ (పోక్సో), బాల్య వివాహం గురించి తెలుసు. వాటిలో ఒకదాని గురించి అడుగు. అసురక్షితంగా అనిపిస్తే నమ్మకమైన పెద్దవాళ్లకు చెప్పు లేదా 1098కి ఫోన్ చేయి.','ਵਧੀਆ ਸਵਾਲ! ਮੈਨੂੰ ਸਕੂਲ ਦੇ ਹੱਕ, ਬਾਲ ਮਜ਼ਦੂਰੀ, ਦੁਰਵਿਵਹਾਰ ਤੋਂ ਸੁਰੱਖਿਆ (ਪੋਕਸੋ) ਤੇ ਬਾਲ ਵਿਆਹ ਬਾਰੇ ਪਤਾ ਹੈ। ਇਹਨਾਂ ਵਿੱਚੋਂ ਕਿਸੇ ਬਾਰੇ ਪੁੱਛੋ। ਅਸੁਰੱਖਿਅਤ ਲੱਗੇ ਤਾਂ ਕਿਸੇ ਭਰੋਸੇਮੰਦ ਵੱਡੇ ਨੂੰ ਦੱਸੋ ਜਾਂ 1098 ’ਤੇ ਫ਼ੋਨ ਕਰੋ।');
var DANGER=/hurt|touch|\bhit\b|beat|scared|afraid|abus|forc|marry|marriage|shaadi|run away|unsafe|threat|kill|die|suicide|मार|डर|छू|शादी|அடி|பயம்|தொட|திருமண|కొట్ట|భయం|తాక|పెళ్లి|ਮਾਰ|ਡਰ|ਛੂ|ਵਿਆਹ/i;
var chatLog=[],busy=false;
function localAnswer(q){for(var i=0;i<FAQ.length;i++){if(FAQ[i][0].test(q))return T(FAQ[i][1])}return T(DEFAULT_A)}
function helpCard(){var m=L('You are not alone. Tell a grown-up you trust.','तुम अकेले नहीं हो। किसी भरोसेमंद बड़े को बताओ।','நீ தனியாக இல்லை. நம்பகமான பெரியவரிடம் சொல்.','నువ్వు ఒంటరివి కావు. నమ్మకమైన పెద్దవాళ్లకు చెప్పు.','ਤੁਸੀਂ ਇਕੱਲੇ ਨਹੀਂ ਹੋ। ਕਿਸੇ ਭਰੋਸੇਮੰਦ ਵੱਡੇ ਨੂੰ ਦੱਸੋ।');return '<b>'+esc(T(m))+'</b><br><a href="tel:1098">📞 1098</a> · <a href="tel:112">📞 112</a> · <a href="tel:15100">📞 15100</a>'}
function addMsg(kind,html,isHtml){var d=document.createElement('div');d.className='m '+kind;if(isHtml)d.innerHTML=html;else d.textContent=html;var box=$('#msgs');box.appendChild(d);box.scrollTop=box.scrollHeight;return d}
function chatRefreshChips(){if(!chatLog.length&&$('#cchips')&&!$('#chat').hidden){$('#cchips').innerHTML=['c1','c2','c3','c4'].map(function(k){return '<button class="chp">'+esc(t(k))+'</button>'}).join('')}}
function openChat(){
  sfx('hoot');showPanel($('#chat'));
  if(!$('#msgs').children.length){addMsg('bot',t('intro'));$('#cchips').innerHTML=['c1','c2','c3','c4'].map(function(k){return '<button class="chp">'+esc(t(k))+'</button>'}).join('')}
  setTimeout(function(){$('#cin').focus()},300);
}
function closeChat(){hidePanel($('#chat'))}
$('#chatFab').addEventListener('click',function(){$('#chat').hidden||!$('#chat').classList.contains('open')?openChat():closeChat()});
$('#chatX').addEventListener('click',closeChat);
$('#cchips').addEventListener('click',function(e){var b=e.target.closest('.chp');if(b)ask(b.textContent)});
$('#csend').addEventListener('click',function(){var v=$('#cin').value.trim();if(v){$('#cin').value='';ask(v)}});
$('#cin').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.isComposing){e.preventDefault();$('#csend').click()}});

async function ask(text){
  if(busy)return;busy=true;sfx('pop');$('#cchips').innerHTML='';
  chatLog.push({role:'user',text:text});addMsg('me',text);
  var bubble=addMsg('bot','<span class="typing"><i></i><i></i><i></i></span>',true),reply=null;
  try{
    var sample=window.claude&&window.claude.use?await window.claude.use('sample'):null;
    if(sample){
      var hist=chatLog.slice(-8).map(function(m){return (m.role==='user'?'Child: ':'Gyani: ')+m.text}).join('\n');
      var prompt=SYSTEM+'\nThe child chose to use '+LNAME[lang]+'. Reply in '+LNAME[lang]+' (in its own script) unless the child writes in another language.\n\nConversation so far:\n'+hist+'\n\nReply now as Gyani to the child\'s last message.';
      var res=await sample(prompt,{modelTier:'quick',cache:false,onText:function(x){if(x&&x.text){bubble.textContent=x.text;$('#msgs').scrollTop=$('#msgs').scrollHeight}}});
      reply=res&&res.text?res.text.trim():null;
    }
  }catch(err){reply=null}
  if(!reply)reply=localAnswer(text);
  bubble.textContent=reply;chatLog.push({role:'assistant',text:reply});sfx('msg');
  if(DANGER.test(text))addMsg('help',helpCard(),true);
  busy=false;$('#msgs').scrollTop=$('#msgs').scrollHeight;
}

/* =============== BOOT =============== */
$('#logoOwl').innerHTML=owl(38);$('#fabOwl').innerHTML=owl(36);$('#chatOwl').innerHTML=owl(40);
$('#soundBtn').textContent=soundOn?'🔊':'🔇';$('#soundBtn').setAttribute('aria-pressed',soundOn?'true':'false');
lang=prefs.lang&&UI.tagline[prefs.lang]?prefs.lang:'en';
social.langs[lang]=1;saveSocial();applyStatic();home();
if(!prefs.lang){showPanel($('#langM'))}
})();
</script>
<script>
/* ===== SPLASH SCREEN LOGIC ===== */
(function(){
  var sp=document.getElementById('splash'); if(!sp) return;
  var seen=false; try{seen=sessionStorage.getItem('saksham_splash')==='1'}catch(e){}
  function done(){
    if(sp.classList.contains('sp-out')) return;
    try{sessionStorage.setItem('saksham_splash','1')}catch(e){}
    sp.classList.add('sp-out'); document.documentElement.style.overflow='';
    setTimeout(function(){ if(sp.parentNode) sp.parentNode.removeChild(sp); },950);
  }
  if(seen){ sp.parentNode.removeChild(sp); return; }
  document.documentElement.style.overflow='hidden';

  var st=document.getElementById('spStars');
  for(var i=0;i<18;i++){var s=document.createElement('i');s.style.left=(Math.random()*96+2)+'%';s.style.top=(Math.random()*55+4)+'%';
    s.style.animationDelay=(Math.random()*2.8)+'s';s.style.transform='scale(.4)';st.appendChild(s);}

  var tips=['Every child has the right to go to school.','No child under 14 should be made to work.','It is never a child’s fault. Always tell someone you trust.','You can call 1098 any time, for free.','Your choices matter. Let’s explore the town!'];
  var tip=document.getElementById('spTip'),fill=document.getElementById('spFill'),go=document.getElementById('spGo');
  var p=0,ti=0,t0=Date.now(),MIN=3200;
  var tipTimer=setInterval(function(){tip.style.opacity=0;setTimeout(function(){tip.textContent=tips[ti++%tips.length];tip.style.opacity=1;},300);},1500);
  var bar=setInterval(function(){
    var ready=document.readyState==='complete', el=Date.now()-t0;
    p=Math.min(ready?100:92, p+(100-p)*.07+.6); if(el<MIN) p=Math.min(p,el/MIN*100);
    fill.style.width=p+'%';
    if(p>=99.5&&ready&&el>=MIN){clearInterval(bar);clearInterval(tipTimer);tip.style.opacity=1;tip.textContent='Ready, let’s go!';go.classList.add('show');go.focus({preventScroll:true});}
  },80);

  go.addEventListener('click',done);
  document.getElementById('spSkip').addEventListener('click',done);
  document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&go.classList.contains('show')&&document.getElementById('splash')){e.preventDefault();done();}});

  var L=document.getElementById('spPL'),R=document.getElementById('spPR');
  window.addEventListener('pointermove',function(e){
    var o=document.querySelector('.sp-owl'); if(!o) return; var r=o.getBoundingClientRect();
    var cx=r.left+r.width/2,cy=r.top+r.height*.4,a=Math.atan2(e.clientY-cy,e.clientX-cx),d=Math.min(9,Math.hypot(e.clientX-cx,e.clientY-cy)/40);
    var t='translate('+Math.cos(a)*d+'px,'+Math.sin(a)*d+'px)'; L.style.transform=t; R.style.transform=t;
  },{passive:true});
})();
</script>
