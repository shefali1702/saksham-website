<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="saksham-fx.css">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAKSHAM — Every Child, Every Right</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+Devanagari:wght@500;700&family=Noto+Sans+Tamil:wght@500;700&family=Noto+Sans+Telugu:wght@500;700&family=Noto+Sans+Gurmukhi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --sky:#a9d8f5;--sky2:#d8eefb;--cream:#fff7ec;--peach:#ffd9c7;--coral:#ff8470;--terra:#e8715c;--pink:#ffb8ae;--sun:#ffd25e;--sun2:#ffe9a3;
  --ink:#4b3636;--muted:#8a6f6a;--good:#2f9e6e;--bad:#e5484d;--spring:cubic-bezier(.34,1.56,.64,1);
  --display:'Outfit','Noto Sans Devanagari','Noto Sans Tamil','Noto Sans Telugu','Noto Sans Gurmukhi',system-ui,sans-serif;
  --body:'Plus Jakarta Sans','Noto Sans Devanagari','Noto Sans Tamil','Noto Sans Telugu','Noto Sans Gurmukhi',system-ui,-apple-system,'Segoe UI',sans-serif;
  --clay:linear-gradient(145deg,#fffefb,#ffeee0);
  --clayShadow:14px 16px 30px rgba(214,140,110,.26),-10px -10px 24px rgba(255,255,255,.95),inset 0 3px 6px rgba(255,255,255,.95),inset 0 -6px 12px rgba(255,170,140,.16);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px);scroll-behavior:smooth}
body{margin:0;font-family:var(--body);color:var(--ink);line-height:1.5;min-height:100%;background:linear-gradient(180deg,#a9d8f5 0%,#cfe9f8 30%,#fff1e2 62%,#ffd5c4 100%) fixed;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0}
button,select,input{font-family:inherit}
button{cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:0 14px}
.bokeh{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bokeh i{position:absolute;border-radius:50%;filter:blur(14px);opacity:.55;animation:bk 18s ease-in-out infinite alternate}
@keyframes bk{from{transform:translate(0,0) scale(1)}to{transform:translate(40px,-60px) scale(1.2)}}
main,header,footer{position:relative;z-index:1}

/* glass + clay */
.glass{background:rgba(255,255,255,.42);backdrop-filter:blur(12px) saturate(1.5);-webkit-backdrop-filter:blur(12px) saturate(1.5);border:1.5px solid rgba(255,255,255,.75);box-shadow:0 12px 40px rgba(120,80,70,.16)}
.clay{background:var(--clay);border-radius:30px;box-shadow:var(--clayShadow)}
.btn{border:0;border-radius:22px;padding:14px 24px;font-weight:800;font-size:17px;color:#fff;min-height:50px;background:linear-gradient(160deg,#ffa08d,#ee6f59);box-shadow:0 12px 22px rgba(232,113,92,.4),inset 0 3px 5px rgba(255,255,255,.55),inset 0 -5px 10px rgba(180,60,40,.25);transition:transform .45s var(--spring),box-shadow .3s}
.btn:hover{transform:translateY(-3px) scale(1.03)}
.btn:active{transform:translateY(1px) scale(.97);box-shadow:0 4px 10px rgba(232,113,92,.4),inset 0 4px 8px rgba(180,60,40,.3)}
.btn.alt{background:var(--clay);color:var(--ink);box-shadow:var(--clayShadow)}
.btn.sun{background:linear-gradient(160deg,#ffe58f,#ffbf47);color:#5a3b0a;box-shadow:0 12px 22px rgba(255,191,71,.45),inset 0 3px 5px rgba(255,255,255,.7),inset 0 -5px 10px rgba(200,130,20,.25)}
.btn.sm{padding:9px 16px;font-size:14px;min-height:42px;border-radius:16px}
.btn:focus-visible,.opt:focus-visible,.pbtn:focus-visible,.fab:focus-visible{outline:3px solid #fff;box-shadow:0 0 0 6px var(--coral)}

/* nav */
.top{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:30;padding:0 10px}
.nav{max-width:1100px;margin:8px auto 0;border-radius:999px;padding:7px 10px 7px 12px;display:flex;align-items:center;gap:8px;color:#fff;background:rgba(112,66,62,.42);backdrop-filter:blur(12px) saturate(1.5);-webkit-backdrop-filter:blur(12px) saturate(1.5);border:1.5px solid rgba(255,255,255,.55);box-shadow:0 14px 40px rgba(120,70,60,.25)}
.logo{display:flex;align-items:center;gap:6px;background:none;border:0;color:#fff;padding:0;text-align:left}
.logo b{font-family:var(--display);font-size:24px;letter-spacing:1px;display:block;line-height:1;text-shadow:0 2px 6px rgba(80,40,40,.35)}
.logo small{display:block;font-size:11px;font-weight:700;opacity:.92}
.sp{flex:1}
.gauge{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 6px;border-radius:99px;background:rgba(60,30,30,.28);box-shadow:inset 0 3px 7px rgba(0,0,0,.28)}
.segs{display:flex;gap:4px}
.seg{width:22px;height:14px;border-radius:99px;background:rgba(255,255,255,.28);transition:background .5s var(--spring),box-shadow .5s,transform .5s var(--spring)}
.seg.on{background:linear-gradient(180deg,#fff0a6,#ffb62e);box-shadow:0 0 12px #ffd25e,inset 0 2px 2px #fff9;transform:scaleY(1.2)}
.gauge b{font-family:var(--display);font-size:15px}
.lang{display:flex;align-items:center;gap:4px;border-radius:99px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.5);padding:0 4px 0 10px}
.lang select{appearance:none;-webkit-appearance:none;background:transparent;color:#fff;border:0;font-weight:800;font-size:14px;padding:9px 20px 9px 4px;max-width:104px}
.lang select option{color:#2a2140}
.lang:after{content:"▾";margin-left:-18px;font-size:12px;pointer-events:none}
.pbtn{border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.2);color:#fff;border-radius:99px;min-width:42px;height:42px;font-size:17px;font-weight:800;padding:0 12px;transition:transform .4s var(--spring),background .2s}
.pbtn:hover{transform:scale(1.08);background:rgba(255,255,255,.35)}
.pbtn[aria-pressed="false"]{opacity:.6}
@media(max-width:700px){.logo small,.pbtn .t,.gauge b{display:none}.nav{gap:5px}.logo b{font-size:20px}.seg{width:16px}}

main{padding:16px 0 150px}
.view{animation:pop .5s var(--spring) both}
@keyframes pop{from{opacity:0;transform:scale(.88) translateY(14px)}to{opacity:1;transform:none}}

/* hero */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;align-items:center;margin:10px 0 16px}
.hero .txt{padding:22px 24px;border-radius:34px}
.kick{font-weight:800;color:var(--terra);letter-spacing:.5px}
.hero h1{font-size:clamp(44px,8vw,78px);font-weight:800;background:linear-gradient(90deg,var(--terra),#ff9d6c 55%,#f2b43c);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:1px}
.tagl{font-family:var(--display);font-size:clamp(20px,3vw,28px);font-weight:700;margin:2px 0 8px}
.hero p{font-size:clamp(15px,2.2vw,18px);color:#6b5050;margin:0;font-weight:600}
.mascot{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:250px}
.say{position:relative;max-width:300px;min-height:70px;padding:14px 18px;border-radius:26px;font-weight:800;font-size:16px;margin-bottom:6px;animation:float 5s ease-in-out infinite}
.say:after{content:"";position:absolute;bottom:-10px;left:54%;border:10px solid transparent;border-top-color:rgba(255,255,255,.7);border-bottom:0}
.say.typing:after{}
.say .cur{display:inline-block;width:2px;height:1em;background:var(--terra);margin-left:2px;vertical-align:-2px;animation:blinkc .7s steps(1) infinite}
@keyframes blinkc{50%{opacity:0}}
.owlwrap{position:relative;width:190px;height:190px;display:grid;place-items:center}
.owlwrap:before{content:"";position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffe9d8 55%,#ffcfb8);box-shadow:inset -10px -14px 24px rgba(240,150,120,.35),0 24px 34px rgba(200,110,90,.28)}
.owlwrap svg{position:relative;filter:drop-shadow(0 10px 8px rgba(120,60,40,.3))}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media(max-width:760px){.hero{grid-template-columns:1fr}.mascot{flex-direction:row;min-height:0;gap:8px}.owlwrap{width:130px;height:130px}.owlwrap svg{width:110px;height:110px}.say{max-width:62%}}

/* town */
.town{position:relative;border-radius:46px;overflow:hidden;border:6px solid rgba(255,255,255,.85);box-shadow:0 30px 60px rgba(150,100,100,.3);background:#bfe3f7;transform:perspective(1400px) rotateX(calc(var(--my,0)*-1.6deg)) rotateY(calc(var(--mx,0)*2.2deg));transition:transform .5s var(--spring)}
.town svg{display:block;width:100%;height:auto}
.tilt{position:absolute;left:0;right:0;height:20%;pointer-events:none;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.tilt.t{top:0;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.tilt.b{bottom:0;-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}
.px{transform:translate(calc(var(--mx,0)*var(--d,10)*-1px),calc(var(--my,0)*var(--d,10)*-.6px));transition:transform .35s ease-out}
.cl{animation:drift var(--sp,90s) linear infinite;animation-delay:var(--dl,0s)}
@keyframes drift{from{transform:translateX(-320px)}to{transform:translateX(1560px)}}
.flt{animation:isl 6s ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes isl{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.bld{cursor:pointer;outline:none}
.bi{transform-box:fill-box;transform-origin:50% 100%;transition:transform .55s var(--spring),filter .3s}
.bld:hover .bi,.bld:focus-visible .bi{transform:translateY(-14px) scale(1.045);filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 16px #ffd25e)}
.bld:active .bi{transform:translateY(-4px) scale(.98)}
.plate rect{transition:fill .3s}
.bld:hover .plate rect,.bld:focus-visible .plate rect{fill:#fff}
.plate text{font-family:var(--display);font-weight:800;pointer-events:none}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(2.3);opacity:0}}
.bk{animation:bkb 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bkb{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.leaf{animation:leaf var(--du,16s) linear infinite;animation-delay:var(--dl,0s)}
@keyframes leaf{0%{transform:translate(0,-40px) rotate(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translate(var(--dx,120px),700px) rotate(540deg);opacity:0}}
.bird{animation:fly var(--du,24s) linear infinite;animation-delay:var(--dl,0s)}
@keyframes fly{from{transform:translate(-80px,0)}to{transform:translate(1300px,-40px)}}
.wing{transform-box:fill-box;transform-origin:center;animation:flap .5s ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(-.6)}}
.ray{animation:ray 7s ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
@keyframes ray{from{opacity:.22}to{opacity:.6}}
.steam{animation:steam 3s ease-out infinite;animation-delay:var(--dl,0s)}
@keyframes steam{from{transform:translateY(0) scale(.6);opacity:.8}to{transform:translateY(-34px) scale(1.5);opacity:0}}
.flag{transform-box:fill-box;transform-origin:left center;animation:wv 1.5s ease-in-out infinite}
@keyframes wv{0%,100%{transform:skewY(-7deg)}50%{transform:skewY(7deg)}}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin:22px 0}
.card{position:relative;text-align:left;border:0;padding:18px;color:var(--ink);overflow:hidden;transition:transform .5s var(--spring),box-shadow .3s}
.card:hover{transform:translateY(-8px) rotate(-.6deg)}
.card:before{content:"";position:absolute;inset:0;border-radius:30px;padding:2px;background:conic-gradient(from 0deg,#fff0,var(--sun),#fff0,var(--coral),#fff0);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .3s}
.card:hover:before{opacity:1}
.card .ic{font-size:44px;filter:drop-shadow(0 6px 6px rgba(150,80,50,.25))}
.card h3{font-size:22px;margin:4px 0}
.card p{margin:0 0 10px;color:var(--muted);font-size:14.5px;font-weight:600}
.card .bar{position:absolute;left:18px;top:0;width:60px;height:8px;border-radius:0 0 10px 10px}
.tag{display:inline-block;border-radius:99px;padding:4px 14px;font-weight:800;font-size:13px;background:#fff;box-shadow:inset 0 2px 4px rgba(200,120,90,.2)}
.tag.done{background:linear-gradient(180deg,#fff0a6,#ffd25e);color:#5a3b0a}

/* player */
.ptop{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.pt{font-family:var(--display);font-size:clamp(20px,3vw,26px);font-weight:800;flex:1;min-width:150px}
.pdots{display:flex;gap:5px;width:100%;padding:4px;border-radius:99px;background:rgba(255,255,255,.5);box-shadow:inset 0 2px 5px rgba(150,90,70,.2)}
.pd{flex:1;height:10px;border-radius:9px;background:rgba(150,110,100,.18);transition:background .4s}
.pd.on{background:linear-gradient(180deg,var(--rc,var(--coral)),color-mix(in srgb,var(--rc,var(--coral)) 70%,#fff))}
.stage{position:relative;border-radius:36px;overflow:hidden;min-height:320px;display:flex;align-items:flex-end;justify-content:space-evenly;gap:6px;padding:84px 10px 16px;background:linear-gradient(var(--s1),var(--s2) 72%,var(--g) 72%);border:5px solid rgba(255,255,255,.85);box-shadow:0 24px 50px rgba(150,100,90,.28);transition:filter .6s}
.stage:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 22%,rgba(255,255,255,.7) 0 40px,transparent 41px),radial-gradient(circle at 82% 14%,rgba(255,240,180,.8) 0 60px,transparent 61px),radial-gradient(circle at 60% 40%,rgba(255,255,255,.45) 0 30px,transparent 31px);filter:blur(10px);pointer-events:none;animation:bk 14s ease-in-out infinite alternate}
.stage.dim{filter:saturate(.55) brightness(.93)}
.bg-school{--s1:#9bd6f7;--s2:#e0f3fd;--g:#9fd98f}
.bg-tea{--s1:#ffd9b0;--s2:#fff0d6;--g:#d9b280}
.bg-dhaba{--s1:#ffae82;--s2:#ffdcb0;--g:#c4916a}
.bg-home{--s1:#ffe6cc;--s2:#fff5e8;--g:#e5bf98}
.bg-field{--s1:#ffd98a;--s2:#fff2c2;--g:#9ad06a}
.prop{position:absolute;font-size:60px;top:14px;right:22px;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 8px 6px rgba(120,70,40,.25))}
.actor{position:relative;display:flex;flex-direction:column;align-items:center;max-width:46%;min-width:0;z-index:1}
.actor svg{width:clamp(86px,24vw,128px);height:auto;overflow:visible;filter:drop-shadow(0 10px 6px rgba(120,70,40,.28))}
.actor svg.adult{width:clamp(100px,28vw,148px)}
.bubble{background:#fff;color:#4b3636;border-radius:20px;padding:9px 14px;font-weight:800;font-size:15px;box-shadow:0 8px 18px rgba(120,70,40,.2);margin-bottom:10px;position:relative;max-width:250px;animation:pop .5s var(--spring) both;line-height:1.35}
.bubble:after{content:"";position:absolute;bottom:-8px;left:50%;margin-left:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
.nametag{background:rgba(255,255,255,.9);color:#4b3636;border-radius:99px;padding:1px 12px;font-size:13px;font-weight:800;margin-top:2px;box-shadow:0 3px 8px rgba(120,70,40,.15)}
.fig{animation:bob 2.2s ease-in-out infinite}
.eyes{animation:blink 4.6s infinite;transform-box:fill-box;transform-origin:center}
.arm.wave{animation:armwave .9s ease-in-out infinite;transform-origin:68px 66px}
.tear{animation:tear 2.4s infinite}
.owl .wing2{transform-box:view-box}
.owl .wl{transform-origin:30px 50px;animation:flapl 2.6s ease-in-out infinite}
.owl .wr{transform-origin:70px 50px;animation:flapr 2.6s ease-in-out infinite}
.owl-float{animation:bob 2.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes armwave{0%,100%{transform:rotate(-125deg)}50%{transform:rotate(-155deg)}}
@keyframes tear{0%{transform:translateY(-3px);opacity:0}30%{opacity:1}100%{transform:translateY(12px);opacity:0}}
@keyframes flapl{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(14deg)}94%{transform:rotate(-4deg)}}
@keyframes flapr{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(-14deg)}94%{transform:rotate(4deg)}}
.narr{padding:16px 18px;margin:14px 0;font-size:clamp(17px,2.6vw,20px);font-weight:700;border-radius:26px;display:flex;gap:12px;align-items:flex-start}
.narr span{flex:1}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.opts{display:grid;gap:12px;margin:12px 0}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:0;color:var(--ink);padding:14px 16px;font-size:17px;font-weight:700;min-height:58px;border-radius:24px;background:var(--clay);box-shadow:var(--clayShadow);transition:transform .45s var(--spring),box-shadow .3s}
.opt:hover:not(:disabled){transform:translateX(6px) scale(1.01)}
.opt:active:not(:disabled){transform:scale(.98)}
.opt .l{flex:none;width:36px;height:36px;border-radius:50%;background:linear-gradient(160deg,#fff,#ffe0d2);display:grid;place-items:center;font-family:var(--display);font-weight:800;box-shadow:inset 0 -3px 5px rgba(240,140,110,.3),0 3px 6px rgba(200,110,80,.2)}
.opt.ok{background:linear-gradient(145deg,#e4fbef,#bdeed7);color:#0b5c3a}
.opt.no{background:linear-gradient(145deg,#ffecec,#ffc9c9);color:#8a1f24;animation:shake .4s}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{border-radius:22px;padding:12px 18px;font-weight:800;margin:12px 0;animation:pop .5s var(--spring) both}
.fb.good{background:linear-gradient(145deg,#e4fbef,#bdeed7);color:#0b5c3a}
.fb.warn{background:linear-gradient(145deg,#fff4d1,#ffe29a);color:#6b4a00}
.fb.bad{background:linear-gradient(145deg,#ffecec,#ffc9c9);color:#8a1f24}
.law{border-radius:34px;overflow:hidden}
.law .lh{padding:20px 22px;background:linear-gradient(135deg,var(--rc,var(--coral)),color-mix(in srgb,var(--rc,var(--coral)) 60%,#ffd25e));color:#fff}
.law .lh small{font-weight:800;letter-spacing:.8px;text-transform:uppercase;opacity:.95}
.law .lh h2{font-size:clamp(22px,4vw,30px);text-shadow:0 2px 6px rgba(0,0,0,.18)}
.law .lb{padding:18px 22px}
.law ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.law li{display:flex;gap:12px;font-weight:700;font-size:17px}
.law li:before{content:"✔";flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(160deg,#6fdba8,#2f9e6e);color:#fff;font-size:14px;box-shadow:0 3px 6px rgba(40,140,100,.3)}
.remember{margin:18px 0;background:linear-gradient(145deg,#fff6cf,#ffe58f);color:#5a4300;border-radius:24px;padding:16px;font-family:var(--display);font-size:clamp(19px,3vw,24px);font-weight:700;text-align:center;box-shadow:var(--clayShadow)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chp{background:#fff;border-radius:99px;padding:7px 14px;font-weight:800;font-size:14px;border:0;color:var(--ink);box-shadow:0 4px 10px rgba(200,120,90,.18);transition:transform .4s var(--spring)}
button.chp:hover{transform:translateY(-2px) scale(1.05)}
.fine{font-size:13px;color:var(--muted);font-weight:600;margin:12px 0 0}
.qbox{padding:18px;border-radius:32px}
.qbox h3{font-size:clamp(21px,3.5vw,27px);margin:8px 0 10px}
.big{text-align:center;padding:28px 16px;border-radius:36px}
.big .stars{font-size:56px;letter-spacing:6px;filter:drop-shadow(0 6px 6px rgba(200,140,40,.35))}
.big h2{font-size:34px;margin:6px 0}
.cert{background:linear-gradient(135deg,#fff0b8,#ffd9e3 50%,#d6e4ff);border-radius:34px;padding:28px;text-align:center;border:4px dashed #ffffffcc;margin:22px 0;box-shadow:var(--clayShadow)}
.cert h2{font-size:clamp(28px,5vw,42px)}
footer.foot{margin:30px 0 0;padding:18px 20px;border-radius:28px;font-weight:600;color:#5d4545;font-size:14.5px}
footer .row{justify-content:flex-start;margin-top:10px}

/* fabs */
.fab{position:fixed;z-index:40;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;border-radius:99px;padding:11px 20px;font-weight:800;font-size:16px;min-height:54px;color:#fff;transition:transform .5s var(--spring),box-shadow .3s;border:1.5px solid rgba(255,255,255,.7)}
.fab:hover{transform:translateY(-4px) scale(1.05)}
.fab:active{transform:scale(.95)}
#helpFab{left:14px;background:linear-gradient(135deg,rgba(255,110,90,.88),rgba(255,160,120,.82));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 12px 28px rgba(232,90,70,.4);animation:fabp 2.6s infinite}
#helpFab:hover{box-shadow:0 0 0 3px #fff,0 0 28px rgba(255,120,90,.9)}
#chatFab{right:14px;background:rgba(255,255,255,.55);color:var(--ink);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:5px 20px 5px 6px;box-shadow:0 12px 28px rgba(120,80,70,.22)}
#chatFab:hover{box-shadow:0 0 0 3px #fff,0 0 28px rgba(255,210,94,.95)}
#chatFab .ow{background:#fff;border-radius:50%;display:grid;place-items:center;width:46px;height:46px;box-shadow:inset 0 -4px 6px rgba(240,150,120,.3)}
@keyframes fabp{0%{box-shadow:0 0 0 0 rgba(255,110,90,.55),0 12px 28px rgba(232,90,70,.4)}70%{box-shadow:0 0 0 18px rgba(255,110,90,0),0 12px 28px rgba(232,90,70,.4)}100%{box-shadow:0 0 0 0 rgba(255,110,90,0),0 12px 28px rgba(232,90,70,.4)}}

/* modals + chat (slide-in springs) */
.modal{position:fixed;inset:0;z-index:60;background:rgba(90,50,50,.38);display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .3s}
.modal[hidden]{display:none}
.modal.open{opacity:1}
.sheet{max-width:540px;width:100%;max-height:92%;overflow:auto;border-radius:34px;background:rgba(255,250,244,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1.5px solid #fff;box-shadow:0 30px 80px rgba(100,50,50,.4);transform:translateY(40px) scale(.88);transition:transform .55s var(--spring)}
.modal.open .sheet{transform:none}
.sheet .hd{padding:20px 22px;background:linear-gradient(135deg,#59b8c9,#7aa6f0);color:#fff;display:flex;gap:12px;align-items:center}
.sheet .hd h2{font-size:28px;flex:1}
.sheet .bd{padding:16px 20px 22px;display:grid;gap:12px}
.x{background:rgba(255,255,255,.35);border:0;color:#fff;width:42px;height:42px;border-radius:50%;font-size:20px;font-weight:800;transition:transform .4s var(--spring)}
.x:hover{transform:rotate(90deg) scale(1.1)}
.contact{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);border-radius:24px;padding:12px 16px;background:var(--clay);box-shadow:var(--clayShadow);transition:transform .45s var(--spring),box-shadow .3s}
.contact:hover,.contact:focus-visible{transform:translateY(-3px) scale(1.02);outline:none;box-shadow:0 0 0 3px #fff,0 0 22px rgba(89,184,201,.9)}
.contact .n{font-family:var(--display);font-weight:800;font-size:30px;min-width:96px;color:#2a8f9f}
.contact b{display:block;font-size:16px}
.contact span{font-size:13.5px;color:var(--muted);font-weight:600}
.calm{background:rgba(213,244,247,.85);color:#1b5d68;border-radius:20px;padding:12px 16px;font-weight:700}
.langs{display:grid;gap:10px}
.langs .btn{display:flex;justify-content:space-between;align-items:center;font-size:20px}
.langs .btn small{opacity:.85;font-weight:700;font-size:13px}
.chat{position:fixed;z-index:50;right:16px;bottom:calc(86px + env(safe-area-inset-bottom,0px));width:390px;height:min(640px,74vh);border-radius:32px;display:flex;flex-direction:column;overflow:hidden;background:rgba(255,250,244,.66);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:1.5px solid rgba(255,255,255,.9);box-shadow:0 28px 70px rgba(100,50,50,.35);opacity:0;transform:translate(60px,40px) scale(.85);transform-origin:100% 100%;transition:transform .55s var(--spring),opacity .3s}
.chat[hidden]{display:none}
.chat.open{opacity:1;transform:none}
@media(max-width:560px){.chat{left:8px;right:8px;width:auto;height:74vh}}
.chead{display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(135deg,var(--coral),#ffab7a);color:#fff}
.chead .ow{background:#fff;border-radius:50%;width:48px;height:48px;display:grid;place-items:center}
.chead b{font-family:var(--display);font-size:22px;display:block;line-height:1}
.chead small{opacity:.95;font-weight:700}
.chead .x{margin-left:auto}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:86%;padding:10px 14px;border-radius:20px;font-weight:600;font-size:15.5px;white-space:pre-wrap;word-wrap:break-word;animation:pop .4s var(--spring) both}
.m.bot{background:#fff;border-bottom-left-radius:6px;align-self:flex-start;box-shadow:0 6px 14px rgba(200,120,90,.16)}
.m.me{background:linear-gradient(160deg,#ffa08d,#ee6f59);color:#fff;border-bottom-right-radius:6px;align-self:flex-end;box-shadow:0 6px 14px rgba(232,113,92,.35)}
.m.help{background:rgba(213,244,247,.95);color:#1b5d68;align-self:flex-start}
.m.help a{font-weight:800;color:#0e6e7a}
.typing i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:4px;animation:tdot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.cchips{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 0}
.cchips .chp{white-space:nowrap}
.cin{display:flex;gap:8px;padding:10px 12px}
.cin input{flex:1;min-width:0;border:0;border-radius:18px;padding:11px 16px;font-weight:600;background:#fff;color:var(--ink);font-size:16px;box-shadow:inset 0 3px 6px rgba(200,120,90,.2)}
.cin input:focus{outline:3px solid rgba(255,132,112,.5)}
.cnote{margin:0;padding:0 14px 10px;font-size:12px;color:var(--muted);font-weight:700}

/* teacher */
.tsec{padding:20px;margin:14px 0}
.tsec h3{font-size:24px;margin-bottom:6px}
.tg{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.tg h4{margin:10px 0 4px;font-family:var(--display);font-size:17px;color:var(--terra)}
.tg ul{margin:0;padding-left:20px;font-weight:600;font-size:15px}
.key{display:none;background:#fff;border-radius:18px;padding:10px 14px;margin-top:10px;font-size:14.5px;font-weight:600;box-shadow:inset 0 2px 6px rgba(200,120,90,.2)}
.showkey .key{display:block}
.proj main{zoom:1.18}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
#confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
@media print{.top,.fab,.chat,.modal,.bokeh,#confetti,.noprint{display:none!important}body{background:#fff}.clay,.glass{box-shadow:none!important;border:1px solid #ccc}.key{display:block!important}.view{animation:none}}

.segs{flex-wrap:wrap;gap:2px;max-width:150px}
.segs .seg,.segs .seg.on{width:6px;height:12px}

.tnav{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px 0 4px;flex-wrap:wrap}
.tdots{display:flex;gap:4px;align-items:center}
.tdot{width:14px;height:14px;border-radius:50%;border:0;background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 2px rgba(120,80,80,.25);cursor:pointer;padding:0;margin:0 2px}
.tdot.on{background:#ff8470;transform:scale(1.3)}
.tlbl{font-weight:800;min-width:78px;text-align:center}

/* =============== v3: tabs, map, facts, community, badges =============== */
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
.tabs{max-width:1100px;margin:8px auto 0;display:flex;gap:6px;padding:6px;border-radius:999px;overflow-x:auto;scrollbar-width:none;justify-content:center}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:0;border-radius:99px;padding:8px 16px;min-height:42px;font-weight:800;font-size:15px;color:var(--ink);background:transparent;transition:transform .4s var(--spring),background .25s,box-shadow .25s}
.tab:hover{transform:translateY(-2px);background:rgba(255,255,255,.55)}
.tab[aria-selected="true"]{background:linear-gradient(160deg,#ff9d86,#ee6f59);color:#fff;box-shadow:0 8px 16px rgba(232,113,92,.4),inset 0 2px 3px rgba(255,255,255,.5)}
.tab:focus-visible{outline:3px solid #fff;box-shadow:0 0 0 6px var(--coral)}
.tab .ti{font-size:18px}
@media(max-width:520px){.tab{padding:8px 11px;font-size:13px;gap:4px}.tab .ti{font-size:16px}}

/* map */
.mapsec{padding:20px;margin:24px 0;border-radius:38px}
.mhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.mhead h2{font-size:clamp(24px,4vw,34px)}
.mhead p{margin:4px 0 0;color:var(--muted);font-weight:600;max-width:560px}
.tmap{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;max-width:640px;margin:18px auto 14px;padding:12px;border-radius:30px;background:rgba(255,255,255,.4);box-shadow:inset 0 3px 8px rgba(150,90,70,.15)}
.tl{aspect-ratio:1;min-width:0;border:0;border-radius:32%;padding:0;position:relative;font-family:var(--display);font-weight:800;font-size:clamp(10px,2.3vw,15px);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);background:linear-gradient(150deg,var(--c1),var(--c2));box-shadow:0 6px 10px rgba(120,70,50,.22),inset 0 2px 3px rgba(255,255,255,.5),inset 0 -4px 6px rgba(0,0,0,.12);opacity:.74;transition:transform .45s var(--spring),opacity .2s,box-shadow .3s}
.tl:hover{transform:translateY(-4px) scale(1.14);opacity:1;z-index:2}
.tl:focus-visible{outline:3px solid #fff;box-shadow:0 0 0 5px var(--coral);opacity:1;z-index:3}
.tl.seen{opacity:1}
.tl.seen:after{content:"★";position:absolute;top:-4px;right:-1px;font-size:12px;color:#ffe27a;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.tl.sel{opacity:1;transform:scale(1.2);box-shadow:0 0 0 3px #fff,0 0 20px rgba(255,210,94,.95);z-index:4}
.tl[data-r="n"]{--c1:#7fb8f0;--c2:#4f8fdc}
.tl[data-r="c"]{--c1:#ffb066;--c2:#e8803a}
.tl[data-r="e"]{--c1:#7fd49a;--c2:#3fa466}
.tl[data-r="w"]{--c1:#ff9fb8;--c2:#e8648f}
.tl[data-r="s"]{--c1:#6ed3cf;--c2:#2f9fa0}
.tl[data-r="ne"]{--c1:#c3a0ec;--c2:#8a62c7}
.tl[data-r="ut"]{--c1:#e6cc7a;--c2:#b8962e}
.minfo{min-height:104px;padding:14px 16px;border-radius:26px;background:rgba(255,255,255,.72);box-shadow:inset 0 2px 6px rgba(200,120,90,.18);max-width:640px;margin:0 auto}
.minfo .mi0{display:grid;place-items:center;min-height:76px;font-weight:800;color:var(--muted);text-align:center}
.minfo .mi{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;animation:pop .45s var(--spring) both}
.minfo .mic{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:19px;color:#fff;background:linear-gradient(150deg,var(--c1),var(--c2));box-shadow:0 6px 10px rgba(120,70,50,.25),inset 0 2px 3px rgba(255,255,255,.5)}
.minfo .mt{flex:1;min-width:200px}
.minfo h3{font-size:22px;margin-bottom:4px}
.minfo p{margin:8px 0 0;font-weight:700;font-size:16.5px}

/* facts */
.fsec{margin:24px 0;padding:22px;border-radius:38px;background:linear-gradient(135deg,#fff6cf,#ffe3a0);display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;overflow:hidden;position:relative}
.fsec:before,.fsec:after{content:"✦";position:absolute;color:#fff;opacity:.8;animation:twk 3.2s ease-in-out infinite}
.fsec:before{top:12px;right:22px;font-size:22px}
.fsec:after{bottom:14px;right:64px;font-size:14px;animation-delay:-1.4s}
@keyframes twk{0%,100%{transform:scale(.6) rotate(0);opacity:.3}50%{transform:scale(1.2) rotate(40deg);opacity:1}}
.fic{font-size:clamp(54px,12vw,84px);filter:drop-shadow(0 8px 8px rgba(150,100,20,.3));animation:bob 3s ease-in-out infinite}
.fsec h3{font-size:20px;color:#8a5a00;letter-spacing:.4px;text-transform:uppercase}
.ftxt{font-family:var(--display);font-size:clamp(19px,3vw,27px);font-weight:700;color:#5a4300;margin:6px 0 12px;line-height:1.3}
.fcard.flip .fic,.fcard.flip .ftxt{animation:flipx .5s ease}
@keyframes flipx{0%{transform:rotateX(0);opacity:1}50%{transform:rotateX(90deg);opacity:0}100%{transform:rotateX(0);opacity:1}}
@media(max-width:520px){.fsec{grid-template-columns:1fr;text-align:center}.fsec .row{justify-content:center}}

/* badges */
.bsum{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:20px;border-radius:34px;margin:12px 0}
.bsum .grow{flex:1;min-width:220px}
.bsum h2{font-size:clamp(26px,4.5vw,38px)}
.bsum p{margin:4px 0 10px;font-weight:600;color:var(--muted)}
.bar2{height:12px;border-radius:9px;background:rgba(150,110,100,.2);overflow:hidden;box-shadow:inset 0 2px 4px rgba(120,70,50,.2)}
.bar2 i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--coral),var(--sun));transition:width .8s var(--spring)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin:16px 0}
.bdg{text-align:center;padding:18px 10px 14px;border-radius:28px;background:var(--clay);box-shadow:var(--clayShadow);transition:transform .5s var(--spring)}
.bdg:hover{transform:translateY(-6px) rotate(-1deg)}
.med{width:88px;height:88px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;font-size:42px;background:radial-gradient(circle at 30% 25%,#fff,var(--bc) 72%);border:4px solid #fff;box-shadow:inset 0 -7px 12px rgba(0,0,0,.14),0 10px 18px rgba(0,0,0,.18);position:relative}
.bdg.on .med:before{content:"";position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.9),transparent 35%);animation:spin 4s linear infinite;mask:radial-gradient(circle,transparent 62%,#000 64%);-webkit-mask:radial-gradient(circle,transparent 62%,#000 64%)}
@keyframes spin{to{transform:rotate(360deg)}}
.bdg.lock .med{filter:grayscale(1) brightness(1.08);opacity:.5}
.bdg.lock .med:after{content:"🔒";position:absolute;bottom:-6px;right:-6px;font-size:22px;filter:none}
.bdg b{display:block;font-family:var(--display);font-size:17px;margin-bottom:2px}
.bdg small{display:block;color:var(--muted);font-weight:600;font-size:12.5px;line-height:1.35}
.bdg.next{outline:3px dashed rgba(255,132,112,.6);outline-offset:3px}

/* community */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.scard{padding:14px 12px;border-radius:26px;background:var(--clay);box-shadow:var(--clayShadow);text-align:center;transition:transform .5s var(--spring);position:relative}
.scard:hover{transform:translateY(-5px)}
.scard .av{font-size:46px;line-height:1.1;filter:drop-shadow(0 5px 4px rgba(120,70,40,.25))}
.scard b{display:block;font-family:var(--display);font-size:18px;margin:2px 0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scard small{display:block;font-weight:700;font-size:12.5px;color:var(--muted);margin-top:6px}
.scard .mini{font-size:18px;margin-top:4px;min-height:24px;letter-spacing:2px}
.scard.me{outline:3px solid var(--coral)}
.youtag{position:absolute;top:8px;right:10px;font-size:11px;font-weight:800;background:var(--coral);color:#fff;border-radius:99px;padding:1px 9px}
.avpick{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.avb{width:46px;height:46px;border-radius:50%;border:0;font-size:24px;background:#fff;box-shadow:0 4px 8px rgba(200,120,90,.2);transition:transform .4s var(--spring)}
.avb:hover{transform:scale(1.12)}
.avb[aria-pressed="true"]{outline:3px solid var(--coral);transform:scale(1.1)}
.fld{width:100%;border:0;border-radius:18px;padding:12px 16px;font-weight:700;background:#fff;color:var(--ink);font-size:16px;box-shadow:inset 0 3px 6px rgba(200,120,90,.2)}
.fld:focus{outline:3px solid rgba(255,132,112,.5)}
textarea.fld{min-height:64px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.codebox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.codebox code{flex:1;min-width:180px;background:#fff;border-radius:14px;padding:10px 12px;font-size:12.5px;word-break:break-all;box-shadow:inset 0 2px 5px rgba(200,120,90,.2)}
details.tsec summary{cursor:pointer;font-family:var(--display);font-size:clamp(22px,3.4vw,28px);font-weight:800;list-style:none;display:flex;align-items:center;gap:10px}
details.tsec summary::-webkit-details-marker{display:none}
details.tsec summary:after{content:"▾";margin-left:auto;transition:transform .3s}
details.tsec[open] summary:after{transform:rotate(180deg)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.stat{background:#fff;border-radius:20px;padding:12px;text-align:center;box-shadow:inset 0 2px 6px rgba(200,120,90,.18)}
.stat b{display:block;font-family:var(--display);font-size:28px;color:var(--terra)}
.stat span{font-size:12.5px;font-weight:700;color:var(--muted)}
.insight{background:rgba(213,244,247,.85);color:#1b5d68;border-radius:18px;padding:10px 14px;font-weight:700;font-size:14.5px;margin:8px 0}
details.stu{background:#fff;border-radius:20px;margin:8px 0;box-shadow:inset 0 2px 6px rgba(200,120,90,.15)}
details.stu summary{cursor:pointer;padding:10px 14px;display:flex;align-items:center;gap:10px;font-weight:800;list-style:none}
details.stu summary::-webkit-details-marker{display:none}
details.stu .sb{padding:4px 14px 14px}
.stu .sn{flex:none;min-width:120px;display:flex;gap:8px;align-items:center}
.stu .sbar{flex:1;min-width:60px}
.stu .sv{font-size:13px;white-space:nowrap;color:var(--muted)}
.rcg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.rc{font-size:13px;font-weight:700;border-radius:99px;padding:3px 10px;background:rgba(150,110,100,.12);color:var(--muted)}
.rc.d{background:linear-gradient(180deg,#e4fbef,#bdeed7);color:#0b5c3a}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 150px);transform:translate(-50%,-24px) scale(.9);opacity:0;pointer-events:none;z-index:80;max-width:min(92vw,460px);text-align:center;padding:12px 22px;border-radius:99px;font-weight:800;font-size:16px;color:#5a3b0a;background:linear-gradient(160deg,#fff0a6,#ffc94d);box-shadow:0 14px 30px rgba(200,140,20,.4),inset 0 2px 4px rgba(255,255,255,.7);transition:transform .5s var(--spring),opacity .3s}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
/* ===== SPLASH SCREEN ===== */
#splash{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;overflow:hidden;text-align:center;color:#4b3636;
  background:linear-gradient(180deg,#8fcdf2 0%,#cfe9f8 30%,#fff1e2 60%,#ffb9a3 100%);
  transition:opacity .8s ease,transform .9s cubic-bezier(.7,0,.3,1),filter .8s}
#splash.sp-out{opacity:0;transform:scale(1.18);filter:blur(10px);pointer-events:none}
#splash *{box-sizing:border-box}
.sp-sun{position:absolute;top:8%;left:50%;width:min(46vw,220px);aspect-ratio:1;margin-left:calc(min(46vw,220px)/-2);border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff7c9,#ffd25e 55%,#ffb347);
  box-shadow:0 0 0 26px rgba(255,210,94,.22),0 0 0 70px rgba(255,210,94,.12),0 0 140px 50px rgba(255,210,94,.55);animation:spSun 5s ease-in-out infinite}
@keyframes spSun{50%{transform:scale(1.08)}}
.sp-rays{position:absolute;top:calc(8% + min(23vw,110px));left:50%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.35) 0 6deg,transparent 6deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 42%);mask:radial-gradient(circle,#000 0,transparent 42%);animation:spSpin 90s linear infinite}
@keyframes spSpin{to{transform:rotate(360deg)}}

 heroSub:L('Explore the sunny town, open each building, make choices and learn the rights that protect every child.','धूप भरे शहर में घूमो, हर इमारत खोलो, चुनाव करो और वे अधिकार सीखो जो हर बच्चे की रक्षा करते हैं।','வெயில் நிறைந்த ஊரைச் சுற்றிப் பார், ஒவ்வொரு கட்டிடத்தையும் திற, தேர்வுகள் செய், ஒவ்வொரு குழந்தையையும் காக்கும் உரிமைகளைக் கற்றுக்கொள்.','ఎండ నిండిన ఊరిలో తిరుగు, ప్రతి భవనం తెరువు, ఎంపికలు చేయి, ప్రతి బిడ్డను కాపాడే హక్కులు నేర్చుకో.','ਧੁੱਪ ਭਰੇ ਕਸਬੇ ਵਿੱਚ ਘੁੰਮੋ, ਹਰ ਇਮਾਰਤ ਖੋਲ੍ਹੋ, ਚੋਣਾਂ ਕਰੋ ਤੇ ਉਹ ਹੱਕ ਸਿੱਖੋ ਜੋ ਹਰ ਬੱਚੇ ਦੀ ਰਾਖੀ ਕਰਦੇ ਨੇ।'),

 gSome:L('Great going! Open the next building.','बहुत बढ़िया! अगली इमारत खोलो।','அருமை! அடுத்த கட்டிடத்தைத் திற.','చాలా బాగుంది! తర్వాతి భవనం తెరువు.','ਬਹੁਤ ਵਧੀਆ! ਅਗਲੀ ਇਮਾਰਤ ਖੋਲ੍ਹੋ।'),

 lawNote:L('Laws can change. Ask your teacher or call NALSA 15100 for the latest.','क़ानून बदल सकते हैं। ताज़ा जानकारी के लिए शिक्षक से पूछो या NALSA 15100 पर फ़ोन करो।','சட்டங்கள் மாறலாம். புதிய தகவலுக்கு ஆசிரியரிடம் கேள் அல்லது NALSA 15100-க்கு அழை.','చట్టాలు మారవచ్చు. తాజా సమాచారం కోసం ఉపాధ్యాయులను అడుగు లేదా NALSA 15100కి ఫోన్ చేయి.','ਕਾਨੂੰਨ ਬਦਲ ਸਕਦੇ ਨੇ। ਤਾਜ਼ਾ ਜਾਣਕਾਰੀ ਲਈ ਅਧਿਆਪਕ ਤੋਂ ਪੁੱਛੋ ਜਾਂ NALSA 15100 ’ਤੇ ਫ਼ੋਨ ਕਰੋ।'),

 intro:L('Hoo-hoo! I am Gyani 🦉 Ask me about your rights: school, work, staying safe, or marriage.','हू-हू! मैं ज्ञानी हूँ 🦉 मुझसे अपने अधिकारों के बारे में पूछो: स्कूल, काम, सुरक्षा या शादी।','ஹூ-ஹூ! நான் ஞானி 🦉 உன் உரிமைகள் பற்றிக் கேள்: பள்ளி, வேலை, பாதுகாப்பு, திருமணம்.','హూ-హూ! నేను జ్ఞానిని 🦉 నీ హక్కుల గురించి అడుగు: బడి, పని, భద్రత, పెళ్లి.','ਹੂ-ਹੂ! ਮੈਂ ਗਿਆਨੀ ਹਾਂ 🦉 ਮੈਨੂੰ ਆਪਣੇ ਹੱਕਾਂ ਬਾਰੇ ਪੁੱਛੋ: ਸਕੂਲ, ਕੰਮ, ਸੁਰੱਖਿਆ ਜਾਂ ਵਿਆਹ।'),
 c1:L('Is school really free?','क्या स्कूल सच में मुफ़्त है?','பள்ளி உண்மையிலேயே இலவசமா?','బడి నిజంగా ఉచితమా?','ਕੀ ਸਕੂਲ ਸੱਚਮੁੱਚ ਮੁਫ਼ਤ ਹੈ?'),
 c2:L('Can I work at 12?','क्या मैं 12 साल में काम कर सकता हूँ?','12 வயதில் நான் வேலை செய்யலாமா?','12 ఏళ్లకు నేను పని చేయవచ్చా?','ਕੀ ਮੈਂ 12 ਸਾਲ ਦੀ ਉਮਰ ਵਿੱਚ ਕੰਮ ਕਰ ਸਕਦਾ ਹਾਂ?'),
 c3:L('What is POCSO?','पॉक्सो क्या है?','போக்சோ என்றால் என்ன?','పోక్సో అంటే ఏమిటి?','ਪੋਕਸੋ ਕੀ ਹੈ?'),
 c4:L('My friend feels unsafe','मेरे दोस्त को असुरक्षित लगता है','என் நண்பனுக்குப் பாதுகாப்பற்றதாக உள்ளது','నా స్నేహితుడికి అసురక్షితంగా ఉంది','ਮੇਰੇ ਦੋਸਤ ਨੂੰ ਅਸੁਰੱਖਿਅਤ ਲੱਗਦਾ ਹੈ'),
 cnote:L('Gyani is a friendly guide, not a lawyer. In danger? Call 112. Need to talk? Call 1098.','ज्ञानी एक दोस्ताना गाइड है, वकील नहीं। ख़तरे में हो? 112 पर फ़ोन करो। बात करनी है? 1098 पर।','ஞானி நட்பான வழிகாட்டி, வழக்கறிஞர் அல்ல. ஆபத்தில் இருக்கிறாயா? 112-க்கு அழை. பேச வேண்டுமா? 1098.','జ్ఞాని స్నేహపూర్వక గైడ్, లాయర్ కాదు. ప్రమాదంలో ఉన్నావా? 112కి ఫోన్ చేయి. మాట్లాడాలా? 1098.','ਗਿਆਨੀ ਦੋਸਤਾਨਾ ਗਾਈਡ ਹੈ, ਵਕੀਲ ਨਹੀਂ। ਖ਼ਤਰੇ ਵਿੱਚ ਹੋ? 112 ’ਤੇ ਫ਼ੋਨ ਕਰੋ। ਗੱਲ ਕਰਨੀ ਹੈ? 1098।'),
 helpT:L('Help Centre','सहायता केंद्र','உதவி மையம்','సహాయ కేంద్రం','ਸਹਾਇਤਾ ਕੇਂਦਰ'),
 calm:L('You are not alone and it is never your fault. Tell a grown-up you trust. You can call these numbers any time, for free.','तुम अकेले नहीं हो और यह कभी तुम्हारी ग़लती नहीं है। किसी भरोसेमंद बड़े को बताओ। तुम इन नंबरों पर कभी भी मुफ़्त फ़ोन कर सकते हो।','நீ தனியாக இல்லை, இது ஒருபோதும் உன் தவறு அல்ல. நம்பகமான பெரியவரிடம் சொல். இந்த எண்களை எப்போது வேண்டுமானாலும் இலவசமாக அழைக்கலாம்.','నువ్వు ఒంటరివి కావు, ఇది ఎప్పుడూ నీ తప్పు కాదు. నమ్మకమైన పెద్దవాళ్లకు చెప్పు. ఈ నంబర్లకు ఎప్పుడైనా ఉచితంగా ఫోన్ చేయవచ్చు.','ਤੁਸੀਂ ਇਕੱਲੇ ਨਹੀਂ ਹੋ ਤੇ ਇਹ ਕਦੇ ਤੁਹਾਡੀ ਗ਼ਲਤੀ ਨਹੀਂ। ਕਿਸੇ ਭਰੋਸੇਮੰਦ ਵੱਡੇ ਨੂੰ ਦੱਸੋ। ਤੁਸੀਂ ਇਹਨਾਂ ਨੰਬਰਾਂ ’ਤੇ ਕਦੇ ਵੀ ਮੁਫ਼ਤ ਫ਼ੋਨ ਕਰ ਸਕਦੇ ਹੋ।'),
 chN:L('Childline','चाइल्डलाइन','சைல்டுலைன்','చైల్డ్‌లైన్','ਚਾਈਲਡਲਾਈਨ'),
 emN:L('Emergency','आपातकाल','அவசரம்','అత్యవసరం','ਐਮਰਜੈਂਸੀ'),
 nalN:L('NALSA Legal Aid','NALSA क़ानूनी सहायता','NALSA சட்ட உதவி','NALSA న్యాయ సహాయం','NALSA ਕਾਨੂੰਨੀ ਮਦਦ'),
 chD:L('Free, 24 hours. For any child who needs help or protection.','मुफ़्त, 24 घंटे। मदद या सुरक्षा चाहने वाले हर बच्चे के लिए।','இலவசம், 24 மணி நேரம். உதவி அல்லது பாதுகாப்பு தேவைப்படும் எந்தக் குழந்தைக்கும்.','ఉచితం, 24 గంటలు. సాయం లేదా రక్షణ కావాల్సిన ప్రతి బిడ్డకు.','ਮੁਫ਼ਤ, 24 ਘੰਟੇ। ਮਦਦ ਜਾਂ ਸੁਰੱਖਿਆ ਚਾਹੁੰਦੇ ਹਰ ਬੱਚੇ ਲਈ।'),
 emD:L('Police, ambulance, fire. Call if someone is in danger right now.','पुलिस, एम्बुलेंस, दमकल। अभी किसी पर ख़तरा हो तो फ़ोन करो।','காவல்துறை, ஆம்புலன்ஸ், தீயணைப்பு. இப்போதே யாரேனும் ஆபத்தில் இருந்தால் அழை.','పోలీసు, అంబులెన్స్, అగ్నిమాపక. ఇప్పుడే ఎవరికైనా ప్రమాదం ఉంటే ఫోన్ చేయి.','ਪੁਲਿਸ, ਐਂਬੂਲੈਂਸ, ਫਾਇਰ। ਹੁਣੇ ਕਿਸੇ ਨੂੰ ਖ਼ਤਰਾ ਹੋਵੇ ਤਾਂ ਫ਼ੋਨ ਕਰੋ।'),
 nalD:L('Free legal help and advice from the National Legal Services Authority.','राष्ट्रीय विधिक सेवा प्राधिकरण से मुफ़्त क़ानूनी मदद और सलाह।','தேசிய சட்ட சேவைகள் ஆணையத்திடமிருந்து இலவச சட்ட உதவி, ஆலோசனை.','జాతీయ న్యాయ సేవల అథారిటీ నుంచి ఉచిత న్యాయ సహాయం, సలహా.','ਰਾਸ਼ਟਰੀ ਕਾਨੂੰਨੀ ਸੇਵਾਵਾਂ ਅਥਾਰਟੀ ਤੋਂ ਮੁਫ਼ਤ ਕਾਨੂੰਨੀ ਮਦਦ ਤੇ ਸਲਾਹ।'),
 trust:L('Trusted grown-ups: a parent, a teacher, a relative, a neighbour. If one does not listen, tell another.','भरोसेमंद बड़े: माता-पिता, शिक्षक, रिश्तेदार, पड़ोसी। कोई न सुने तो किसी और को बताओ।','நம்பகமான பெரியவர்கள்: பெற்றோர், ஆசிரியர், உறவினர், அண்டை வீட்டார். ஒருவர் கேட்காவிட்டால் மற்றொருவரிடம் சொல்.','నమ్మకమైన పెద్దవాళ్లు: తల్లిదండ్రులు, ఉపాధ్యాయులు, బంధువులు, పొరుగువారు. ఒకరు వినకపోతే మరొకరికి చెప్పు.','ਭਰੋਸੇਮੰਦ ਵੱਡੇ: ਮਾਪੇ, ਅਧਿਆਪਕ, ਰਿਸ਼ਤੇਦਾਰ, ਗੁਆਂਢੀ। ਕੋਈ ਨਾ ਸੁਣੇ ਤਾਂ ਕਿਸੇ ਹੋਰ ਨੂੰ ਦੱਸੋ।'),
 foot:L('For schools, NGOs and parents: Saksham is free, needs no login or install, and keeps progress only on this device. Nothing about the child is collected. The Help button is on every screen. Laws change, so teachers should confirm details with official sources.','स्कूलों, NGO और अभिभावकों के लिए: सक्षम मुफ़्त है, इसमें लॉगिन या इंस्टॉल की ज़रूरत नहीं, और प्रगति सिर्फ़ इसी डिवाइस पर रहती है। बच्चे की कोई जानकारी इकट्ठा नहीं होती। मदद बटन हर स्क्रीन पर है। क़ानून बदलते हैं, इसलिए शिक्षक आधिकारिक स्रोतों से जाँच लें।','பள்ளிகள், தன்னார்வ அமைப்புகள், பெற்றோருக்கு: சக்ஷம் இலவசம், உள்நுழைவு அல்லது நிறுவல் தேவையில்லை, முன்னேற்றம் இந்தச் சாதனத்தில் மட்டுமே இருக்கும். குழந்தையைப் பற்றிய எந்தத் தகவலும் சேகரிக்கப்படுவதில்லை. உதவி பொத்தான் ஒவ்வொரு திரையிலும் உள்ளது. சட்டங்கள் மாறும், எனவே ஆசிரியர்கள் அதிகாரப்பூர்வ ஆதாரங்களில் சரிபார்க்கவும்.','పాఠశాలలు, ఎన్జీఓలు, తల్లిదండ్రులకు: సక్షమ్ ఉచితం, లాగిన్ లేదా ఇన్‌స్టాల్ అవసరం లేదు, పురోగతి ఈ పరికరంలోనే ఉంటుంది. పిల్లల గురించి ఏ సమాచారమూ సేకరించరు. సహాయం బటన్ ప్రతి స్క్రీన్‌లో ఉంది. చట్టాలు మారతాయి, కాబట్టి ఉపాధ్యాయులు అధికారిక వనరులతో సరిచూసుకోండి.','ਸਕੂਲਾਂ, NGO ਤੇ ਮਾਪਿਆਂ ਲਈ: ਸਕਸ਼ਮ ਮੁਫ਼ਤ ਹੈ, ਲੌਗਇਨ ਜਾਂ ਇੰਸਟਾਲ ਦੀ ਲੋੜ ਨਹੀਂ, ਤੇ ਤਰੱਕੀ ਸਿਰਫ਼ ਇਸੇ ਡਿਵਾਈਸ ’ਤੇ ਰਹਿੰਦੀ ਹੈ। ਬੱਚੇ ਬਾਰੇ ਕੋਈ ਜਾਣਕਾਰੀ ਇਕੱਠੀ ਨਹੀਂ ਹੁੰਦੀ। ਮਦਦ ਬਟਨ ਹਰ ਸਕ੍ਰੀਨ ’ਤੇ ਹੈ। ਕਾਨੂੰਨ ਬਦਲਦੇ ਨੇ, ਇਸ ਲਈ ਅਧਿਆਪਕ ਅਧਿਕਾਰਤ ਸਰੋਤਾਂ ਤੋਂ ਜਾਂਚ ਲੈਣ।'),

 certTx:L('You unlocked every building in Saksham. Now you know your rights, and you can help a friend know theirs. Every Child, Every Right.','तुमने सक्षम की हर इमारत खोल ली। अब तुम अपने अधिकार जानते हो और अपने दोस्त को भी बता सकते हो। हर बच्चा, हर अधिकार।','சக்ஷமின் எல்லாக் கட்டிடங்களையும் திறந்துவிட்டாய். இப்போது உன் உரிமைகள் உனக்குத் தெரியும், நண்பனுக்கும் சொல்லலாம். ஒவ்வொரு குழந்தை, ஒவ்வொரு உரிமை.','సక్షమ్‌లోని ప్రతి భవనం తెరిచావు. ఇప్పుడు నీ హక్కులు నీకు తెలుసు, స్నేహితుడికీ చెప్పవచ్చు. ప్రతి బిడ్డ, ప్రతి హక్కు.','ਤੁਸੀਂ ਸਕਸ਼ਮ ਦੀ ਹਰ ਇਮਾਰਤ ਖੋਲ੍ਹ ਲਈ। ਹੁਣ ਤੁਹਾਨੂੰ ਆਪਣੇ ਹੱਕ ਪਤਾ ਨੇ ਤੇ ਦੋਸਤ ਨੂੰ ਵੀ ਦੱਸ ਸਕਦੇ ਹੋ। ਹਰ ਬੱਚਾ, ਹਰ ਅਧਿਕਾਰ।'),

 steps:[
  {t:'story',bg:'school',prop:'🏫',text:L('Meena walks to school every morning with her best friend Raju. But this week, his seat has been empty.','मीना रोज़ सुबह अपने सबसे अच्छे दोस्त राजू के साथ स्कूल जाती है। लेकिन इस हफ़्ते उसकी सीट खाली है।','மீனா தினமும் காலை தன் உயிர் நண்பன் ராஜுவுடன் பள்ளிக்குச் செல்வாள். ஆனால் இந்த வாரம் அவன் இருக்கை காலியாக உள்ளது.','మీనా రోజూ ఉదయం తన ప్రాణ స్నేహితుడు రాజుతో బడికి వెళ్తుంది. కానీ ఈ వారం అతని సీటు ఖాళీగా ఉంది.','ਮੀਨਾ ਹਰ ਸਵੇਰ ਆਪਣੇ ਪੱਕੇ ਦੋਸਤ ਰਾਜੂ ਨਾਲ ਸਕੂਲ ਜਾਂਦੀ ਹੈ। ਪਰ ਇਸ ਹਫ਼ਤੇ ਉਸਦੀ ਸੀਟ ਖਾਲੀ ਹੈ।'),
   cast:[{who:'meena',mood:'worried',say:L('Raju has not come all week. Where is he?','राजू पूरे हफ़्ते नहीं आया। वह कहाँ है?','ராஜு இந்த வாரம் முழுதும் வரவில்லை. அவன் எங்கே?','రాజు వారమంతా రాలేదు. ఎక్కడ ఉన్నాడు?','ਰਾਜੂ ਸਾਰਾ ਹਫ਼ਤਾ ਨਹੀਂ ਆਇਆ। ਉਹ ਕਿੱਥੇ ਹੈ?')}]},
  {t:'story',bg:'tea',prop:'🍵',text:L('Meena finds Raju serving tea at his father\'s stall.','मीना को राजू अपने पिता की चाय की दुकान पर चाय परोसता मिलता है।','மீனா ராஜுவை அவன் அப்பாவின் டீக்கடையில் டீ கொடுப்பதைப் பார்க்கிறாள்.','మీనా రాజును వాళ్ళ నాన్న టీ దుకాణంలో టీ ఇస్తూ చూస్తుంది.','ਮੀਨਾ ਰਾਜੂ ਨੂੰ ਆਪਣੇ ਪਿਤਾ ਦੀ ਚਾਹ ਦੀ ਦੁਕਾਨ ’ਤੇ ਚਾਹ ਦਿੰਦਿਆਂ ਵੇਖਦੀ ਹੈ।'),
   cast:[{who:'raju',mood:'sad',say:L('Papa says school fees are too much. I have to work now.','पापा कहते हैं स्कूल की फ़ीस बहुत ज़्यादा है। अब मुझे काम करना पड़ेगा।','பள்ளிக் கட்டணம் அதிகம் என்று அப்பா சொல்கிறார். நான் இப்போது வேலை செய்ய வேண்டும்.','బడి ఫీజు ఎక్కువ అని నాన్న అంటున్నారు. ఇప్పుడు నేను పని చేయాలి.','ਪਾਪਾ ਕਹਿੰਦੇ ਨੇ ਸਕੂਲ ਦੀ ਫ਼ੀਸ ਬਹੁਤ ਜ਼ਿਆਦਾ ਹੈ। ਹੁਣ ਮੈਨੂੰ ਕੰਮ ਕਰਨਾ ਪਊ।')},{who:'meena',mood:'worried'}]},
  {t:'choice',bg:'tea',prop:'🍵',text:L('What should Meena do?','मीना को क्या करना चाहिए?','மீனா என்ன செய்ய வேண்டும்?','మీనా ఏమి చేయాలి?','ਮੀਨਾ ਨੂੰ ਕੀ ਕਰਨਾ ਚਾਹੀਦਾ ਹੈ?'),
   cast:[{who:'meena',mood:'worried'},{who:'raju',mood:'sad'}],
   options:[
    {label:L('Keep quiet. It is Raju\'s family matter.','चुप रहो। यह राजू के परिवार का मामला है।','அமைதியாக இரு. இது ராஜுவின் குடும்ப விஷயம்.','ఊరుకో. ఇది రాజు కుటుంబ విషయం.','ਚੁੱਪ ਰਹੋ। ਇਹ ਰਾਜੂ ਦੇ ਪਰਿਵਾਰ ਦਾ ਮਾਮਲਾ ਹੈ।'),ok:false,bg:'tea',
     text:L('Weeks pass. Raju never goes back. Years later he cannot read the forms for the job he wants and earns very little. A lost chance, and it was never his fault.','हफ़्ते बीत जाते हैं। राजू कभी स्कूल नहीं लौटता। सालों बाद वह अपनी पसंद की नौकरी के फ़ॉर्म नहीं पढ़ पाता और बहुत कम कमाता है। एक खोया हुआ मौका, और यह उसकी ग़लती कभी नहीं थी।','வாரங்கள் கடக்கின்றன. ராஜு மீண்டும் பள்ளிக்குச் செல்லவே இல்லை. பல ஆண்டுகள் கழித்து அவனுக்கு விருப்பமான வேலைக்கான படிவத்தை படிக்க முடியவில்லை, சம்பளமும் குறைவு. இழந்த வாய்ப்பு, இது அவன் தவறே அல்ல.','వారాలు గడుస్తాయి. రాజు మళ్లీ బడికి వెళ్లడు. ఏళ్ల తర్వాత తనకు కావాల్సిన ఉద్యోగ ఫారమ్ చదవలేడు, జీతం కూడా చాలా తక్కువ. కోల్పోయిన అవకాశం, ఇది అతని తప్పు కానే కాదు.','ਹਫ਼ਤੇ ਬੀਤ ਜਾਂਦੇ ਨੇ। ਰਾਜੂ ਕਦੇ ਸਕੂਲ ਨਹੀਂ ਮੁੜਦਾ। ਸਾਲਾਂ ਬਾਅਦ ਉਹ ਆਪਣੀ ਮਨਪਸੰਦ ਨੌਕਰੀ ਦੇ ਫਾਰਮ ਨਹੀਂ ਪੜ੍ਹ ਸਕਦਾ ਤੇ ਕਮਾਈ ਬਹੁਤ ਘੱਟ ਹੈ। ਗੁਆਚਿਆ ਮੌਕਾ, ਤੇ ਇਹ ਉਸਦੀ ਗ਼ਲਤੀ ਕਦੇ ਨਹੀਂ ਸੀ।'),
     cast:[{who:'raju',mood:'sad'}]},
    {label:L('Tell Sunita Madam and ask what help exists.','सुनीता मैडम को बताओ और पूछो कि क्या मदद मिल सकती है।','சுனிதா மேடத்திடம் சொல்லி என்ன உதவி கிடைக்கும் என்று கேள்.','సునీత మేడమ్‌కి చెప్పి ఏ సాయం ఉందో అడుగు.','ਸੁਨੀਤਾ ਮੈਡਮ ਨੂੰ ਦੱਸੋ ਅਤੇ ਪੁੱਛੋ ਕਿ ਕੀ ਮਦਦ ਮਿਲ ਸਕਦੀ ਹੈ।'),ok:true,bg:'school',
     text:L('Madam visits Raju\'s father and explains: government schools charge NO fees, and the law says Raju has a right to study. By Monday, Raju is back in class!','मैडम राजू के पिता से मिलकर समझाती हैं: सरकारी स्कूल में कोई फ़ीस नहीं लगती, और क़ानून कहता है कि राजू को पढ़ने का अधिकार है। सोमवार तक राजू वापस कक्षा में है!','மேடம் ராஜுவின் அப்பாவைச் சந்தித்து விளக்குகிறார்: அரசுப் பள்ளியில் கட்டணமே இல்லை, ராஜுவுக்குப் படிக்க உரிமை உண்டு என்று சட்டம் சொல்கிறது. திங்கட்கிழமைக்குள் ராஜு வகுப்புக்குத் திரும்பிவிட்டான்!','మేడమ్ రాజు నాన్నను కలిసి వివరిస్తారు: ప్రభుత్వ బడిలో ఫీజు లేదు, రాజుకు చదువుకునే హక్కు ఉందని చట్టం చెబుతోంది. సోమవారానికి రాజు మళ్లీ తరగతిలో ఉన్నాడు!','ਮੈਡਮ ਰਾਜੂ ਦੇ ਪਿਤਾ ਨੂੰ ਮਿਲ ਕੇ ਸਮਝਾਉਂਦੇ ਨੇ: ਸਰਕਾਰੀ ਸਕੂਲ ਵਿੱਚ ਕੋਈ ਫ਼ੀਸ ਨਹੀਂ, ਤੇ ਕਾਨੂੰਨ ਕਹਿੰਦਾ ਹੈ ਕਿ ਰਾਜੂ ਨੂੰ ਪੜ੍ਹਨ ਦਾ ਹੱਕ ਹੈ। ਸੋਮਵਾਰ ਤੱਕ ਰਾਜੂ ਫਿਰ ਜਮਾਤ ਵਿੱਚ ਹੈ!'),
     cast:[{who:'madam',mood:'happy'},{who:'raju',mood:'happy',wave:true},{who:'meena',mood:'happy'}]},
    {label:L('Tell Raju to run away and stay at her house.','राजू से कहो कि भागकर उसके घर रहे।','ராஜுவை ஓடிவந்து தன் வீட்டில் தங்கச் சொல்.','రాజును పారిపోయి తన ఇంట్లో ఉండమని చెప్పు.','ਰਾਜੂ ਨੂੰ ਕਹੋ ਕਿ ਭੱਜ ਕੇ ਉਸਦੇ ਘਰ ਰਹੇ।'),ok:false,bg:'tea',
     text:L('Running away leaves Raju alone and unsafe. Trusted adults, like a teacher, can fix this without anyone getting hurt.','भाग जाने से राजू अकेला और असुरक्षित हो जाता है। टीचर जैसे भरोसेमंद बड़े बिना किसी को नुकसान पहुँचाए इसे सुलझा सकते हैं।','ஓடிப்போனால் ராஜு தனியாக, பாதுகாப்பின்றி இருப்பான். ஆசிரியர் போன்ற நம்பகமான பெரியவர்கள் யாருக்கும் தீங்கு இல்லாமல் இதைத் தீர்க்க முடியும்.','పారిపోతే రాజు ఒంటరిగా, ప్రమాదంలో పడతాడు. ఉపాధ్యాయులు వంటి నమ్మకమైన పెద్దలు ఎవరికీ హాని లేకుండా దీన్ని పరిష్కరించగలరు.','ਭੱਜ ਜਾਣ ਨਾਲ ਰਾਜੂ ਇਕੱਲਾ ਤੇ ਅਸੁਰੱਖਿਅਤ ਹੋ ਜਾਂਦਾ ਹੈ। ਅਧਿਆਪਕ ਵਰਗੇ ਭਰੋਸੇਮੰਦ ਵੱਡੇ ਕਿਸੇ ਨੂੰ ਨੁਕਸਾਨ ਪਹੁੰਚਾਏ ਬਿਨਾਂ ਇਹ ਹੱਲ ਕਰ ਸਕਦੇ ਨੇ।'),
     cast:[{who:'raju',mood:'worried'}]}
   ]}
 ],
 law:{act:L('Right to Education Act, 2009 (Article 21A)','शिक्षा का अधिकार अधिनियम, 2009 (अनुच्छेद 21A)','கல்வி உரிமைச் சட்டம், 2009 (பிரிவு 21A)','విద్యా హక్కు చట్టం, 2009 (ఆర్టికల్ 21A)','ਸਿੱਖਿਆ ਦਾ ਅਧਿਕਾਰ ਐਕਟ, 2009 (ਧਾਰਾ 21A)'),
  points:[
   L('Every child aged 6 to 14 has the right to free and compulsory education.','6 से 14 साल के हर बच्चे को मुफ़्त और अनिवार्य शिक्षा का अधिकार है।','6 முதல் 14 வயதுள்ள ஒவ்வொரு குழந்தைக்கும் இலவச, கட்டாயக் கல்வி பெற உரிமை உண்டு.','6 నుంచి 14 ఏళ్ల ప్రతి బిడ్డకు ఉచిత, నిర్బంధ విద్య పొందే హక్కు ఉంది.','6 ਤੋਂ 14 ਸਾਲ ਦੇ ਹਰ ਬੱਚੇ ਨੂੰ ਮੁਫ਼ਤ ਤੇ ਲਾਜ਼ਮੀ ਸਿੱਖਿਆ ਦਾ ਹੱਕ ਹੈ।'),
   L('Government schools cannot charge fees for elementary classes, and a child cannot be thrown out before finishing class 8.','सरकारी स्कूल प्रारंभिक कक्षाओं की फ़ीस नहीं ले सकते, और आठवीं पूरी करने से पहले किसी बच्चे को निकाला नहीं जा सकता।','அரசுப் பள்ளிகள் தொடக்கக் கல்விக்குக் கட்டணம் வாங்கக் கூடாது; 8-ஆம் வகுப்பு முடிக்கும் முன் எந்தக் குழந்தையையும் வெளியேற்றக் கூடாது.','ప్రభుత్వ బడులు ప్రాథమిక తరగతులకు ఫీజు తీసుకోకూడదు, 8వ తరగతి పూర్తి చేసేలోపు ఏ బిడ్డనూ బయటకు పంపకూడదు.','ਸਰਕਾਰੀ ਸਕੂਲ ਮੁੱਢਲੀਆਂ ਜਮਾਤਾਂ ਦੀ ਫ਼ੀਸ ਨਹੀਂ ਲੈ ਸਕਦੇ, ਤੇ ਅੱਠਵੀਂ ਪੂਰੀ ਕਰਨ ਤੋਂ ਪਹਿਲਾਂ ਕਿਸੇ ਬੱਚੇ ਨੂੰ ਕੱਢਿਆ ਨਹੀਂ ਜਾ ਸਕਦਾ।'),
   L('Private schools must keep 25% of entry-class seats free for children from poorer families.','निजी स्कूलों को शुरुआती कक्षा की 25% सीटें ग़रीब परिवारों के बच्चों के लिए मुफ़्त रखनी होती हैं।','தனியார் பள்ளிகள் தொடக்க வகுப்பின் 25% இடங்களை ஏழைக் குடும்பக் குழந்தைகளுக்கு இலவசமாக ஒதுக்க வேண்டும்.','ప్రైవేటు బడులు ప్రవేశ తరగతిలో 25% సీట్లను పేద కుటుంబాల పిల్లలకు ఉచితంగా ఉంచాలి.','ਪ੍ਰਾਈਵੇਟ ਸਕੂਲਾਂ ਨੂੰ ਪਹਿਲੀ ਜਮਾਤ ਦੀਆਂ 25% ਸੀਟਾਂ ਗ਼ਰੀਬ ਪਰਿਵਾਰਾਂ ਦੇ ਬੱਚਿਆਂ ਲਈ ਮੁਫ਼ਤ ਰੱਖਣੀਆਂ ਪੈਂਦੀਆਂ ਨੇ।'),
   L('Teachers are not allowed to beat or mentally harass children.','शिक्षक बच्चों को मार नहीं सकते और न ही मानसिक रूप से परेशान कर सकते हैं।','ஆசிரியர்கள் குழந்தைகளை அடிக்கவோ மனதளவில் துன்புறுத்தவோ கூடாது.','ఉపాధ్యాయులు పిల్లలను కొట్టకూడదు, మానసికంగా వేధించకూడదు.','ਅਧਿਆਪਕ ਬੱਚਿਆਂ ਨੂੰ ਮਾਰ ਨਹੀਂ ਸਕਦੇ ਤੇ ਨਾ ਹੀ ਮਾਨਸਿਕ ਤੌਰ ’ਤੇ ਤੰਗ ਕਰ ਸਕਦੇ ਨੇ।')],
  remember:L('Education is not a favour. It is your right.','शिक्षा कोई एहसान नहीं है। यह तुम्हारा अधिकार है।','கல்வி ஒரு தயவு அல்ல. அது உன் உரிமை.','చదువు దయ కాదు. అది నీ హక్కు.','ਪੜ੍ਹਾਈ ਕੋਈ ਮਿਹਰਬਾਨੀ ਨਹੀਂ। ਇਹ ਤੁਹਾਡਾ ਹੱਕ ਹੈ।'),
  help:[H.head,H.child,H.deo]},
 quiz:[
  {q:L('Which ages does the Right to Education cover?','शिक्षा का अधिकार किन उम्र के बच्चों को शामिल करता है?','கல்வி உரிமை எந்த வயதினரை உள்ளடக்கும்?','విద్యా హక్కు ఏ వయసు వారికి వర్తిస్తుంది?','ਸਿੱਖਿਆ ਦਾ ਅਧਿਕਾਰ ਕਿਹੜੀ ਉਮਰ ਦੇ ਬੱਚਿਆਂ ’ਤੇ ਲਾਗੂ ਹੁੰਦਾ ਹੈ?'),o:['3–8','6–14','14–18'],a:1},
  {q:L('A government school asks Raju for fees for class 6. What is true?','सरकारी स्कूल राजू से छठी कक्षा की फ़ीस माँगता है। सही क्या है?','அரசுப் பள்ளி ராஜுவிடம் 6-ஆம் வகுப்புக் கட்டணம் கேட்கிறது. எது சரி?','ప్రభుత్వ బడి రాజును 6వ తరగతి ఫీజు అడుగుతోంది. ఏది నిజం?','ਸਰਕਾਰੀ ਸਕੂਲ ਰਾਜੂ ਤੋਂ ਛੇਵੀਂ ਜਮਾਤ ਦੀ ਫ਼ੀਸ ਮੰਗਦਾ ਹੈ। ਸਹੀ ਕੀ ਹੈ?'),
   o:[L('He must pay','उसे देनी होगी','அவன் கட்ட வேண்டும்','అతను కట్టాలి','ਉਸਨੂੰ ਦੇਣੀ ਪਊ'),L('Elementary education in government schools is free','सरकारी स्कूल में प्रारंभिक शिक्षा मुफ़्त है','அரசுப் பள்ளியில் தொடக்கக் கல்வி இலவசம்','ప్రభుత్వ బడిలో ప్రాథమిక విద్య ఉచితం','ਸਰਕਾਰੀ ਸਕੂਲ ਵਿੱਚ ਮੁੱਢਲੀ ਸਿੱਖਿਆ ਮੁਫ਼ਤ ਹੈ'),L('Only boys get free school','सिर्फ़ लड़कों को मुफ़्त स्कूल मिलता है','ஆண் குழந்தைகளுக்கு மட்டும் இலவசப் பள்ளி','మగపిల్లలకు మాత్రమే ఉచిత బడి','ਸਿਰਫ਼ ਮੁੰਡਿਆਂ ਨੂੰ ਮੁਫ਼ਤ ਸਕੂਲ ਮਿਲਦਾ ਹੈ')],a:1},
  {q:L('What is the best first step if a friend is pulled out of school?','अगर किसी दोस्त का स्कूल छुड़वा दिया जाए तो सबसे अच्छा पहला क़दम क्या है?','ஒரு நண்பனைப் பள்ளியிலிருந்து நிறுத்தினால் சிறந்த முதல் படி என்ன?','స్నేహితుడిని బడి మాన్పిస్తే మొదటి మంచి అడుగు ఏమిటి?','ਜੇ ਕਿਸੇ ਦੋਸਤ ਦਾ ਸਕੂਲ ਛੁਡਵਾ ਦਿੱਤਾ ਜਾਵੇ ਤਾਂ ਸਭ ਤੋਂ ਚੰਗਾ ਪਹਿਲਾ ਕਦਮ ਕੀ ਹੈ?'),
   o:[L('Ignore it','अनदेखा करो','கண்டுகொள்ளாமல் விடு','పట్టించుకోకు','ਅਣਡਿੱਠਾ ਕਰੋ'),L('Hide your friend','दोस्त को छिपा दो','நண்பனை ஒளித்து வை','స్నేహితుడిని దాచిపెట్టు','ਦੋਸਤ ਨੂੰ ਲੁਕਾ ਦਿਓ'),L('Tell a trusted adult such as a teacher','शिक्षक जैसे किसी भरोसेमंद बड़े को बताओ','ஆசிரியர் போன்ற நம்பகமான பெரியவரிடம் சொல்','ఉపాధ్యాయులు వంటి నమ్మకమైన పెద్దవాళ్లకు చెప్పు','ਅਧਿਆਪਕ ਵਰਗੇ ਭਰੋਸੇਮੰਦ ਵੱਡੇ ਨੂੰ ਦੱਸੋ')],a:2}
 ],
 teach:{

 steps:[
  {t:'story',bg:'dhaba',prop:'🍲',text:L('Imran is 13. He washes dishes at a highway dhaba for 12 hours a day. The owner promised him a monthly wage.','इमरान 13 साल का है। वह हाईवे के एक ढाबे पर रोज़ 12 घंटे बर्तन धोता है। मालिक ने उसे महीने की मज़दूरी का वादा किया था।','இம்ரானுக்கு 13 வயது. நெடுஞ்சாலைத் தாபாவில் தினமும் 12 மணி நேரம் பாத்திரம் கழுவுகிறான். உரிமையாளர் மாதச் சம்பளம் தருவதாகச் சொன்னார்.','ఇమ్రాన్ వయసు 13. హైవే ధాబాలో రోజుకు 12 గంటలు గిన్నెలు కడుగుతాడు. యజమాని నెలకు జీతం ఇస్తానని మాట ఇచ్చాడు.','ਇਮਰਾਨ 13 ਸਾਲ ਦਾ ਹੈ। ਉਹ ਹਾਈਵੇ ਦੇ ਢਾਬੇ ’ਤੇ ਰੋਜ਼ 12 ਘੰਟੇ ਭਾਂਡੇ ਧੋਂਦਾ ਹੈ। ਮਾਲਕ ਨੇ ਮਹੀਨੇ ਦੀ ਮਜ਼ਦੂਰੀ ਦਾ ਵਾਅਦਾ ਕੀਤਾ ਸੀ।'),
   cast:[{who:'imran',mood:'worried',say:L('Plates, pots, pans… since 5 in the morning.','थालियाँ, पतीले, कड़ाही… सुबह 5 बजे से।','தட்டுகள், பானைகள், சட்டிகள்… காலை 5 மணி முதல்.','పళ్లాలు, గిన్నెలు, మూకుళ్లు… ఉదయం 5 నుంచి.','ਥਾਲ਼ੀਆਂ, ਪਤੀਲੇ, ਕੜਾਹੀਆਂ… ਸਵੇਰ ਦੇ 5 ਵਜੇ ਤੋਂ।')}]},
  {t:'story',bg:'dhaba',prop:'💸',text:L('Two months pass with no pay. When Imran asks, the owner shouts.','दो महीने बीत गए, कोई पैसा नहीं मिला। इमरान माँगता है तो मालिक चिल्लाता है।','இரண்டு மாதங்கள் ஆகியும் சம்பளம் இல்லை. இம்ரான் கேட்டால் உரிமையாளர் கத்துகிறார்.','రెండు నెలలు గడిచినా జీతం లేదు. ఇమ్రాన్ అడిగితే యజమాని అరుస్తాడు.','ਦੋ ਮਹੀਨੇ ਲੰਘ ਗਏ, ਕੋਈ ਪੈਸਾ ਨਹੀਂ। ਇਮਰਾਨ ਮੰਗਦਾ ਹੈ ਤਾਂ ਮਾਲਕ ਚੀਕਦਾ ਹੈ।'),
   cast:[{who:'seth',mood:'angry',say:L('Wages? You are just a kid. I will pay when I feel like it!','मज़दूरी? तू तो बच्चा है। जब मन करेगा तब दूँगा!','சம்பளமா? நீ சின்னப் பையன். எனக்குத் தோன்றும்போது தருவேன்!','జీతమా? నువ్వు చిన్నపిల్లాడివి. నాకు తోచినప్పుడు ఇస్తా!','ਮਜ਼ਦੂਰੀ? ਤੂੰ ਤਾਂ ਬੱਚਾ ਏਂ। ਜਦੋਂ ਮਰਜ਼ੀ ਹੋਈ ਦੇਊਂਗਾ!')},{who:'imran',mood:'sad'}]},
  {t:'choice',bg:'dhaba',prop:'🍲',text:L('What should Imran do?','इमरान को क्या करना चाहिए?','இம்ரான் என்ன செய்ய வேண்டும்?','ఇమ్రాన్ ఏమి చేయాలి?','ਇਮਰਾਨ ਨੂੰ ਕੀ ਕਰਨਾ ਚਾਹੀਦਾ ਹੈ?'),
   cast:[{who:'pooja',mood:'worried',say:L('Imran, you should be in school, not here.','इमरान, तुम्हें स्कूल में होना चाहिए, यहाँ नहीं।','இம்ரான், நீ பள்ளியில் இருக்க வேண்டும், இங்கே அல்ல.','ఇమ్రాన్, నువ్వు బడిలో ఉండాలి, ఇక్కడ కాదు.','ਇਮਰਾਨ, ਤੈਨੂੰ ਸਕੂਲ ਵਿੱਚ ਹੋਣਾ ਚਾਹੀਦਾ ਹੈ, ਇੱਥੇ ਨਹੀਂ।')},{who:'imran',mood:'sad'}],
   options:[
    {label:L('Beg the owner and keep working.','मालिक से गिड़गिड़ाओ और काम करते रहो।','உரிமையாளரிடம் கெஞ்சி வேலை தொடர்.','యజమానిని బతిమాలి పని కొనసాగించు.','ਮਾਲਕ ਅੱਗੇ ਤਰਲੇ ਕਰੋ ਤੇ ਕੰਮ ਕਰਦੇ ਰਹੋ।'),ok:false,bg:'dhaba',
     text:L('The owner keeps making excuses. Imran works harder, stays unpaid and tired, and misses school. Nothing changes.','मालिक बहाने बनाता रहता है। इमरान और मेहनत करता है, फिर भी बिना पैसे और थका हुआ रहता है, और स्कूल छूट जाता है। कुछ नहीं बदलता।','உரிமையாளர் சாக்குப்போக்கு சொல்லிக்கொண்டே இருக்கிறார். இம்ரான் இன்னும் கடினமாக உழைத்தும் சம்பளமின்றி, களைத்து, பள்ளியை இழக்கிறான். எதுவும் மாறவில்லை.','యజమాని సాకులు చెబుతూనే ఉంటాడు. ఇమ్రాన్ ఇంకా కష్టపడినా జీతం లేదు, అలసిపోతాడు, బడి మానేస్తాడు. ఏమీ మారదు.','ਮਾਲਕ ਬਹਾਨੇ ਬਣਾਉਂਦਾ ਰਹਿੰਦਾ ਹੈ। ਇਮਰਾਨ ਹੋਰ ਮਿਹਨਤ ਕਰਦਾ ਹੈ, ਫਿਰ ਵੀ ਬਿਨਾਂ ਪੈਸੇ ਤੇ ਥੱਕਿਆ ਰਹਿੰਦਾ ਹੈ ਤੇ ਸਕੂਲ ਛੁੱਟ ਜਾਂਦਾ ਹੈ। ਕੁਝ ਨਹੀਂ ਬਦਲਦਾ।'),
     cast:[{who:'imran',mood:'sad'}]},
    {label:L('Tell a trusted adult and call Childline 1098 (it is free).','किसी भरोसेमंद बड़े को बताओ और चाइल्डलाइन 1098 पर फ़ोन करो (यह मुफ़्त है)।','நம்பகமான பெரியவரிடம் சொல்லி சைல்டுலைன் 1098-க்கு அழை (இலவசம்).','నమ్మకమైన పెద్దవాళ్లకు చెప్పి చైల్డ్‌లైన్ 1098కి ఫోన్ చేయి (ఉచితం).','ਕਿਸੇ ਭਰੋਸੇਮੰਦ ਵੱਡੇ ਨੂੰ ਦੱਸੋ ਤੇ ਚਾਈਲਡਲਾਈਨ 1098 ’ਤੇ ਫ਼ੋਨ ਕਰੋ (ਮੁਫ਼ਤ ਹੈ)।'),ok:true,bg:'school',
     text:L('Childline connects Imran with the right officials. They help Imran to safety and back to school, and the owner faces legal action. Imran is NOT in trouble. He is protected.','चाइल्डलाइन इमरान को सही अधिकारियों से जोड़ती है। वे इमरान को सुरक्षित निकालकर स्कूल लौटाने में मदद करते हैं, और मालिक पर क़ानूनी कार्रवाई होती है। इमरान मुसीबत में नहीं है। उसे सुरक्षा मिली है।','சைல்டுலைன் இம்ரானை சரியான அதிகாரிகளுடன் இணைக்கிறது. அவர்கள் இம்ரானைப் பாதுகாப்பாக மீட்டு மீண்டும் பள்ளியில் சேர்க்கிறார்கள்; உரிமையாளர் மீது சட்ட நடவடிக்கை எடுக்கப்படுகிறது. இம்ரான் சிக்கலில் இல்லை. அவன் பாதுகாக்கப்படுகிறான்.','చైల్డ్‌లైన్ ఇమ్రాన్‌ను సరైన అధికారులతో కలుపుతుంది. వారు ఇమ్రాన్‌ను సురక్షితంగా తీసుకువచ్చి మళ్లీ బడిలో చేర్చుతారు, యజమానిపై చట్టపరమైన చర్య తీసుకుంటారు. ఇమ్రాన్ ఇబ్బందిలో లేడు. అతనికి రక్షణ దొరికింది.','ਚਾਈਲਡਲਾਈਨ ਇਮਰਾਨ ਨੂੰ ਸਹੀ ਅਧਿਕਾਰੀਆਂ ਨਾਲ ਜੋੜਦੀ ਹੈ। ਉਹ ਇਮਰਾਨ ਨੂੰ ਸੁਰੱਖਿਅਤ ਕੱਢ ਕੇ ਸਕੂਲ ਵਾਪਸ ਭੇਜਣ ਵਿੱਚ ਮਦਦ ਕਰਦੇ ਨੇ, ਤੇ ਮਾਲਕ ’ਤੇ ਕਾਨੂੰਨੀ ਕਾਰਵਾਈ ਹੁੰਦੀ ਹੈ। ਇਮਰਾਨ ਮੁਸੀਬਤ ਵਿੱਚ ਨਹੀਂ ਹੈ। ਉਸਨੂੰ ਸੁਰੱਖਿਆ ਮਿਲੀ ਹੈ।'),
     cast:[{who:'didi',mood:'happy'},{who:'imran',mood:'happy',wave:true}]},
    {label:L('Take money from the till.','गल्ले से पैसे ले लो।','கல்லாவிலிருந்து பணம் எடு.','గల్లా పెట్టె నుంచి డబ్బు తీసుకో.','ਗੱਲੇ ਵਿੱਚੋਂ ਪੈਸੇ ਲੈ ਲਓ।'),ok:false,bg:'dhaba',
     text:L('That could get Imran blamed and put him in danger. You never have to fix a grown-up\'s wrong by doing something unsafe. There is a safer way.','इससे इमरान पर इल्ज़ाम लग सकता है और वह ख़तरे में पड़ सकता है। किसी बड़े की ग़लती सुधारने के लिए आपको कभी कुछ असुरक्षित नहीं करना पड़ता। एक सुरक्षित रास्ता है।','இதனால் இம்ரான் மீது பழி விழலாம், ஆபத்தும் வரலாம். பெரியவரின் தவறை சரிசெய்ய ஆபத்தான காரியத்தைச் செய்யத் தேவையில்லை. பாதுகாப்பான வழி இருக்கிறது.','దీనివల్ల ఇమ్రాన్‌ను నిందించవచ్చు, అతనికి ప్రమాదం రావచ్చు. పెద్దవాళ్ల తప్పును సరిచేయడానికి ప్రమాదకరమైన పని చేయాల్సిన అవసరం లేదు. సురక్షితమైన దారి ఉంది.','ਇਸ ਨਾਲ ਇਮਰਾਨ ’ਤੇ ਦੋਸ਼ ਲੱਗ ਸਕਦਾ ਹੈ ਤੇ ਉਹ ਖ਼ਤਰੇ ਵਿੱਚ ਪੈ ਸਕਦਾ ਹੈ। ਕਿਸੇ ਵੱਡੇ ਦੀ ਗ਼ਲਤੀ ਠੀਕ ਕਰਨ ਲਈ ਅਸੁਰੱਖਿਅਤ ਕੰਮ ਕਰਨ ਦੀ ਲੋੜ ਨਹੀਂ। ਇੱਕ ਸੁਰੱਖਿਅਤ ਰਾਹ ਹੈ।'),
     cast:[{who:'imran',mood:'worried'}]}
   ]}
 ],
 law:{act:L('Child and Adolescent Labour (Prohibition and Regulation) Act, 1986 (amended 2016)','बाल एवं किशोर श्रम (प्रतिषेध एवं विनियमन) अधिनियम, 1986 (2016 में संशोधित)','குழந்தை மற்றும் வளரிளம் பருவத் தொழிலாளர் (தடை மற்றும் ஒழுங்குமுறை) சட்டம், 1986 (2016 திருத்தம்)','బాల మరియు కౌమార కార్మిక (నిషేధం మరియు నియంత్రణ) చట్టం, 1986 (2016లో సవరణ)','ਬਾਲ ਤੇ ਕਿਸ਼ੋਰ ਮਜ਼ਦੂਰੀ (ਮਨਾਹੀ ਤੇ ਨਿਯਮਨ) ਐਕਟ, 1986 (2016 ਵਿੱਚ ਸੋਧਿਆ)'),
  points:[
   L('Children below 14 cannot be employed in any job.','14 साल से छोटे बच्चों को किसी भी काम पर नहीं रखा जा सकता।','14 வயதுக்குக் கீழ் உள்ள குழந்தைகளை எந்த வேலையிலும் அமர்த்தக் கூடாது.','14 ఏళ్ల లోపు పిల్లలను ఏ పనిలోనూ పెట్టుకోకూడదు.','14 ਸਾਲ ਤੋਂ ਛੋਟੇ ਬੱਚਿਆਂ ਨੂੰ ਕਿਸੇ ਵੀ ਕੰਮ ’ਤੇ ਨਹੀਂ ਰੱਖਿਆ ਜਾ ਸਕਦਾ।'),
   L('Helping your own family after school or in holidays, in safe, non-dangerous work, is allowed. Dhaba work for an outside owner is not.','स्कूल के बाद या छुट्टियों में अपने परिवार की सुरक्षित, ख़तरे से रहित काम में मदद करना ठीक है। बाहरी मालिक के ढाबे पर काम करना ठीक नहीं।','பள்ளி முடிந்த பின் அல்லது விடுமுறையில் உன் குடும்பத்துக்குப் பாதுகாப்பான, ஆபத்தில்லாத வேலையில் உதவுவது அனுமதிக்கப்படும். வெளி உரிமையாளரின் தாபாவில் வேலை செய்வது அனுமதி இல்லை.','బడి తర్వాత లేదా సెలవుల్లో మీ కుటుంబానికి సురక్షితమైన, ప్రమాదం లేని పనిలో సాయం చేయడం అనుమతి. బయటి యజమాని ధాబాలో పని చేయడం కాదు.','ਸਕੂਲ ਤੋਂ ਬਾਅਦ ਜਾਂ ਛੁੱਟੀਆਂ ਵਿੱਚ ਆਪਣੇ ਪਰਿਵਾਰ ਦੇ ਸੁਰੱਖਿਅਤ, ਬਿਨਾਂ ਖ਼ਤਰੇ ਵਾਲੇ ਕੰਮ ਵਿੱਚ ਮਦਦ ਕਰਨ ਦੀ ਇਜਾਜ਼ਤ ਹੈ। ਬਾਹਰਲੇ ਮਾਲਕ ਦੇ ਢਾਬੇ ’ਤੇ ਕੰਮ ਕਰਨ ਦੀ ਨਹੀਂ।'),
   L('Teenagers aged 14 to 18 cannot be made to do dangerous work (like mines or hazardous factories).','14 से 18 साल के किशोरों से ख़तरनाक काम (जैसे खदान या जोखिम भरी फ़ैक्टरी) नहीं कराया जा सकता।','14 முதல் 18 வயதுடைய வளரிளம் பருவத்தினரை ஆபத்தான வேலைகளில் (சுரங்கம், அபாயகரமான தொழிற்சாலை போன்றவை) ஈடுபடுத்தக் கூடாது.','14 నుంచి 18 ఏళ్ల కౌమారులతో ప్రమాదకరమైన పనులు (గనులు, ప్రమాదకర ఫ్యాక్టరీలు వంటివి) చేయించకూడదు.','14 ਤੋਂ 18 ਸਾਲ ਦੇ ਕਿਸ਼ੋਰਾਂ ਤੋਂ ਖ਼ਤਰਨਾਕ ਕੰਮ (ਜਿਵੇਂ ਖਾਣਾਂ ਜਾਂ ਜੋਖ਼ਮ ਭਰੀਆਂ ਫੈਕਟਰੀਆਂ) ਨਹੀਂ ਕਰਵਾਏ ਜਾ ਸਕਦੇ।'),
   L('An employer who hires a child can face jail (6 months to 2 years) and/or a fine of ₹20,000 to ₹50,000.','बच्चे को काम पर रखने वाले मालिक को जेल (6 महीने से 2 साल) और/या ₹20,000 से ₹50,000 तक जुर्माना हो सकता है।','குழந்தையை வேலைக்கு வைக்கும் உரிமையாளருக்கு சிறை (6 மாதம் முதல் 2 ஆண்டு) மற்றும்/அல்லது ₹20,000 முதல் ₹50,000 வரை அபராதம் விதிக்கப்படலாம்.','పిల్లవాడిని పనిలో పెట్టుకున్న యజమానికి జైలు (6 నెలల నుంచి 2 ఏళ్లు) మరియు/లేదా ₹20,000 నుంచి ₹50,000 జరిమానా పడవచ్చు.','ਬੱਚੇ ਨੂੰ ਕੰਮ ’ਤੇ ਰੱਖਣ ਵਾਲੇ ਮਾਲਕ ਨੂੰ ਜੇਲ੍ਹ (6 ਮਹੀਨੇ ਤੋਂ 2 ਸਾਲ) ਅਤੇ/ਜਾਂ ₹20,000 ਤੋਂ ₹50,000 ਤੱਕ ਜੁਰਮਾਨਾ ਹੋ ਸਕਦਾ ਹੈ।'),
   L('The child is treated as someone to protect and help, never punished.','बच्चे को सुरक्षा और मदद देने वाला माना जाता है, उसे कभी सज़ा नहीं दी जाती।','குழந்தை பாதுகாக்கப்பட வேண்டியவராகவும் உதவ வேண்டியவராகவும் கருதப்படுகிறது; ஒருபோதும் தண்டிக்கப்படுவதில்லை.','పిల్లవాడిని రక్షించి, సాయం చేయాల్సిన వ్యక్తిగా చూస్తారు, ఎప్పుడూ శిక్షించరు.','ਬੱਚੇ ਨੂੰ ਸੁਰੱਖਿਆ ਤੇ ਮਦਦ ਦੇਣ ਯੋਗ ਮੰਨਿਆ ਜਾਂਦਾ ਹੈ, ਉਸਨੂੰ ਕਦੇ ਸਜ਼ਾ ਨਹੀਂ ਦਿੱਤੀ ਜਾਂਦੀ।')],
  remember:L('A child\'s place is in school and play, not at work.','बच्चे की जगह स्कूल और खेल में है, काम में नहीं।','குழந்தையின் இடம் பள்ளியும் விளையாட்டும்தான், வேலை அல்ல.','బిడ్డ ఉండాల్సింది బడిలో, ఆటల్లో, పనిలో కాదు.','ਬੱਚੇ ਦੀ ਥਾਂ ਸਕੂਲ ਤੇ ਖੇਡ ਵਿੱਚ ਹੈ, ਕੰਮ ਵਿੱਚ ਨਹੀਂ।'),
  help:[H.child,H.sarpanch,H.police]},
 quiz:[
  {q:L('Can a dhaba legally hire a 13-year-old?','क्या ढाबा क़ानूनन 13 साल के बच्चे को काम पर रख सकता है?','தாபா சட்டப்படி 13 வயது சிறுவனை வேலைக்கு வைக்கலாமா?','ధాబా చట్టప్రకారం 13 ఏళ్ల పిల్లవాడిని పనిలో పెట్టుకోవచ్చా?','ਕੀ ਢਾਬਾ ਕਾਨੂੰਨੀ ਤੌਰ ’ਤੇ 13 ਸਾਲ ਦੇ ਬੱਚੇ ਨੂੰ ਰੱਖ ਸਕਦਾ ਹੈ?'),
   o:[L('Yes, if parents agree','हाँ, अगर माता-पिता मानें','ஆம், பெற்றோர் சம்மதித்தால்','అవును, తల్లిదండ్రులు ఒప్పుకుంటే','ਹਾਂ, ਜੇ ਮਾਪੇ ਮੰਨ ਜਾਣ'),L('Yes, if paid well','हाँ, अगर अच्छा पैसा दें','ஆம், நல்ல சம்பளம் தந்தால்','అవును, మంచి జీతం ఇస్తే','ਹਾਂ, ਜੇ ਚੰਗੇ ਪੈਸੇ ਦੇਵੇ'),L('No, children below 14 cannot be employed','नहीं, 14 साल से छोटे बच्चों को काम पर नहीं रख सकते','இல்லை, 14 வயதுக்குக் கீழ் உள்ளவர்களை வேலைக்கு வைக்கக் கூடாது','కాదు, 14 ఏళ్ల లోపు వారిని పనిలో పెట్టుకోకూడదు','ਨਹੀਂ, 14 ਸਾਲ ਤੋਂ ਛੋਟੇ ਬੱਚਿਆਂ ਨੂੰ ਨਹੀਂ ਰੱਖ ਸਕਦੇ')],a:2},
  {q:L('When a child is made to work, who is in trouble with the law?','जब किसी बच्चे से काम कराया जाता है, तो क़ानून की नज़र में मुसीबत में कौन है?','ஒரு குழந்தையை வேலை செய்ய வைத்தால், சட்டப்படி சிக்கலில் இருப்பவர் யார்?','పిల్లవాడితో పని చేయిస్తే చట్టప్రకారం ఇబ్బందిలో పడేది ఎవరు?','ਜਦੋਂ ਕਿਸੇ ਬੱਚੇ ਤੋਂ ਕੰਮ ਕਰਵਾਇਆ ਜਾਂਦਾ ਹੈ ਤਾਂ ਕਾਨੂੰਨ ਦੀ ਨਜ਼ਰ ਵਿੱਚ ਮੁਸੀਬਤ ਵਿੱਚ ਕੌਣ ਹੈ?'),
   o:[L('The child','बच्चा','குழந்தை','పిల్లవాడు','ਬੱਚਾ'),L('The employer','मालिक','உரிமையாளர்','యజమాని','ਮਾਲਕ'),L('Nobody','कोई नहीं','யாரும் இல்லை','ఎవరూ కాదు','ਕੋਈ ਨਹੀਂ')],a:1},

 teach:{
  obj:[L('Clarify that children below 14 cannot be employed and that the employer, not the child, is responsible.','स्पष्ट करें कि 14 से कम उम्र के बच्चे काम पर नहीं रखे जा सकते और ज़िम्मेदार मालिक है, बच्चा नहीं।'),L('Teach that Childline 1098 is free and safe to call.','सिखाएँ कि चाइल्डलाइन 1098 मुफ़्त और सुरक्षित है।')],
  disc:[L('What is the difference between helping family after school and being employed?','स्कूल के बाद परिवार की मदद करने और नौकरी पर रखे जाने में क्या अंतर है?'),L('Why did taking money from the till make things worse for Imran?','गल्ले से पैसे लेना इमरान के लिए हालात बदतर क्यों कर देता?')],

{
 id:'pocso',icon:'🏠',color:'#5aa9ee',

 title:L('Protection from Abuse (POCSO)','दुर्व्यवहार से सुरक्षा (POCSO)','துன்புறுத்தலிலிருந்து பாதுகாப்பு (POCSO)','వేధింపుల నుండి రక్షణ (POCSO)','ਦੁਰਵਿਵਹਾਰ ਤੋਂ ਸੁਰੱਖਿਆ (POCSO)'),
 blurb:L('A secret that feels scary. Learn who to tell and why it is never your fault.','एक डरावना राज़। जानो किसे बताना है और यह तुम्हारी ग़लती क्यों नहीं है।','பயமுறுத்தும் ஒரு ரகசியம். யாரிடம் சொல்வது, இது ஏன் உன் தவறல்ல என்று அறிந்துகொள்.','భయపెట్టే ఒక రహస్యం. ఎవరికి చెప్పాలో, ఇది ఎందుకు నీ తప్పు కాదో తెలుసుకో.','ਇੱਕ ਡਰਾਉਣਾ ਭੇਤ। ਜਾਣੋ ਕਿਸਨੂੰ ਦੱਸਣਾ ਹੈ ਤੇ ਇਹ ਤੁਹਾਡੀ ਗ਼ਲਤੀ ਕਿਉਂ ਨਹੀਂ।'),
 chars:{

 steps:[
  {t:'story',bg:'home',prop:'🎁',text:L('A grown-up relative gives Anaya gifts. At first it feels nice.','एक बड़ा रिश्तेदार अनाया को तोहफ़े देता है। पहले तो अच्छा लगता है।','ஒரு பெரிய உறவினர் அனாயாவுக்குப் பரிசுகள் தருகிறார். முதலில் நன்றாக இருக்கிறது.','ఒక పెద్ద బంధువు అనాయకు బహుమతులు ఇస్తాడు. మొదట బాగానే అనిపిస్తుంది.','ਇੱਕ ਵੱਡਾ ਰਿਸ਼ਤੇਦਾਰ ਅਨਾਇਆ ਨੂੰ ਤੋਹਫ਼ੇ ਦਿੰਦਾ ਹੈ। ਪਹਿਲਾਂ ਤਾਂ ਚੰਗਾ ਲੱਗਦਾ ਹੈ।'),
   cast:[{who:'anaya',mood:'happy'},{who:'uncle',mood:'happy',say:L('This is our little secret, okay? Do not tell anyone.','यह हमारा छोटा सा राज़ है, ठीक है? किसी को मत बताना।','இது நம் சின்ன ரகசியம், சரியா? யாரிடமும் சொல்லாதே.','ఇది మన చిన్న రహస్యం, సరేనా? ఎవరికీ చెప్పకు.','ਇਹ ਸਾਡਾ ਛੋਟਾ ਜਿਹਾ ਭੇਤ ਹੈ, ਠੀਕ ਹੈ? ਕਿਸੇ ਨੂੰ ਨਾ ਦੱਸੀਂ।')}]},
  {t:'story',bg:'home',prop:'🤫',text:L('Then he starts touching Anaya in ways that make her stomach hurt with worry, and tells her to keep it secret.','फिर वह अनाया को ऐसे छूने लगता है जिससे उसे डर और घबराहट होती है, और कहता है कि यह राज़ रखना।','பிறகு அவர் அனாயாவை பயமும் கவலையும் ஏற்படும் விதத்தில் தொடுகிறார், அதை ரகசியமாக வைக்கச் சொல்கிறார்.','తర్వాత అతను అనాయను భయం, ఆందోళన కలిగేలా తాకుతాడు, దాన్ని రహస్యంగా ఉంచమంటాడు.','ਫਿਰ ਉਹ ਅਨਾਇਆ ਨੂੰ ਅਜਿਹੇ ਢੰਗ ਨਾਲ ਛੂੰਹਦਾ ਹੈ ਜਿਸ ਨਾਲ ਉਸਨੂੰ ਡਰ ਤੇ ਘਬਰਾਹਟ ਹੁੰਦੀ ਹੈ, ਤੇ ਕਹਿੰਦਾ ਹੈ ਕਿ ਇਹ ਭੇਤ ਰੱਖਣਾ।'),
   cast:[{who:'anaya',mood:'worried',say:L('I do not like this. I feel scared.','मुझे यह अच्छा नहीं लग रहा। मुझे डर लग रहा है।','எனக்கு இது பிடிக்கவில்லை. பயமாக இருக்கிறது.','నాకు ఇది నచ్చలేదు. భయంగా ఉంది.','ਮੈਨੂੰ ਇਹ ਚੰਗਾ ਨਹੀਂ ਲੱਗ ਰਿਹਾ। ਮੈਨੂੰ ਡਰ ਲੱਗਦਾ ਹੈ।')},{who:'uncle',mood:'angry'}]},
  {t:'choice',bg:'home',prop:'💛',text:L('What should Anaya do?','अनाया को क्या करना चाहिए?','அனாயா என்ன செய்ய வேண்டும்?','అనాయ ఏమి చేయాలి?','ਅਨਾਇਆ ਨੂੰ ਕੀ ਕਰਨਾ ਚਾਹੀਦਾ ਹੈ?'),
   cast:[{who:'anaya',mood:'worried'}],
   options:[
    {label:L('Keep the secret. He told me to.','राज़ रखो। उसने कहा था।','ரகசியத்தை வைத்திரு. அவர் சொன்னார்.','రహస్యం ఉంచు. అతను చెప్పాడు.','ਭੇਤ ਰੱਖੋ। ਉਸਨੇ ਕਿਹਾ ਸੀ।'),ok:false,bg:'home',
     text:L('Scary secrets grow heavy, and the unsafe behaviour can continue. Grown-ups who hurt children say "keep it secret" because they know it is wrong. A secret that makes you feel unsafe should always be told.','डरावने राज़ भारी होते जाते हैं और ग़लत व्यवहार जारी रह सकता है। बच्चों को चोट पहुँचाने वाले बड़े "राज़ रखना" इसलिए कहते हैं क्योंकि वे जानते हैं कि यह ग़लत है। जो राज़ तुम्हें असुरक्षित लगे, उसे हमेशा बताना चाहिए।','பயமுறுத்தும் ரகசியங்கள் சுமையாகின்றன; தவறான நடத்தை தொடரலாம். குழந்தைகளைத் துன்புறுத்தும் பெரியவர்கள் "ரகசியமாக வை" என்பார்கள், ஏனெனில் அது தவறு என்று அவர்களுக்குத் தெரியும். பாதுகாப்பற்றதாக உணர வைக்கும் ரகசியத்தை எப்போதும் சொல்ல வேண்டும்.','భయపెట్టే రహస్యాలు బరువుగా మారతాయి, తప్పుడు ప్రవర్తన కొనసాగవచ్చు. పిల్లలను బాధపెట్టే పెద్దవాళ్లు "రహస్యంగా ఉంచు" అంటారు, ఎందుకంటే అది తప్పని వాళ్లకు తెలుసు. నీకు అసురక్షితంగా అనిపించే రహస్యాన్ని ఎప్పుడూ చెప్పేయాలి.','ਡਰਾਉਣੇ ਭੇਤ ਭਾਰੇ ਹੁੰਦੇ ਜਾਂਦੇ ਨੇ ਤੇ ਗ਼ਲਤ ਵਿਹਾਰ ਜਾਰੀ ਰਹਿ ਸਕਦਾ ਹੈ। ਬੱਚਿਆਂ ਨੂੰ ਦੁੱਖ ਦੇਣ ਵਾਲੇ ਵੱਡੇ "ਭੇਤ ਰੱਖੋ" ਇਸ ਲਈ ਕਹਿੰਦੇ ਨੇ ਕਿਉਂਕਿ ਉਹ ਜਾਣਦੇ ਨੇ ਇਹ ਗ਼ਲਤ ਹੈ। ਜੋ ਭੇਤ ਤੁਹਾਨੂੰ ਅਸੁਰੱਖਿਅਤ ਮਹਿਸੂਸ ਕਰਵਾਏ, ਉਹ ਹਮੇਸ਼ਾ ਦੱਸਣਾ ਚਾਹੀਦਾ ਹੈ।'),
     cast:[{who:'anaya',mood:'sad'}]},
    {label:L('Say "STOP", move away, and tell a trusted adult. If they do not listen, tell another and call 1098.','"रुको!" कहो, दूर हट जाओ और किसी भरोसेमंद बड़े को बताओ। वे न सुनें तो किसी और को बताओ और 1098 पर फ़ोन करो।','"நிறுத்து!" என்று சொல், விலகிப் போ, நம்பகமான பெரியவரிடம் சொல். அவர் கேட்காவிட்டால் வேறொருவரிடம் சொல், 1098-க்கு அழை.','"ఆపు!" అని చెప్పు, దూరంగా వెళ్లు, నమ్మకమైన పెద్దవాళ్లకు చెప్పు. వాళ్లు వినకపోతే మరొకరికి చెప్పు, 1098కి ఫోన్ చేయి.','"ਬੱਸ!" ਕਹੋ, ਦੂਰ ਹੋ ਜਾਓ ਤੇ ਕਿਸੇ ਭਰੋਸੇਮੰਦ ਵੱਡੇ ਨੂੰ ਦੱਸੋ। ਜੇ ਉਹ ਨਾ ਸੁਣਨ ਤਾਂ ਕਿਸੇ ਹੋਰ ਨੂੰ ਦੱਸੋ ਤੇ 1098 ’ਤੇ ਫ਼ੋਨ ਕਰੋ।'),ok:true,bg:'home',
     text:L('Anaya tells Mummy. Mummy believes her, hugs her, and calls Childline. Anaya is safe, supported and never blamed. She did the bravest thing.','अनाया मम्मी को बताती है। मम्मी उस पर यक़ीन करती हैं, गले लगाती हैं और चाइल्डलाइन को फ़ोन करती हैं। अनाया सुरक्षित है, उसे सहारा मिला है, और उसे कभी दोष नहीं दिया जाता। उसने सबसे बहादुरी का काम किया।','அனாயா அம்மாவிடம் சொல்கிறாள். அம்மா அவளை நம்புகிறார், அணைத்துக்கொள்கிறார், சைல்டுலைனை அழைக்கிறார். அனாயா பாதுகாப்பாக இருக்கிறாள், ஆதரவு பெறுகிறாள், ஒருபோதும் குற்றம் சாட்டப்படுவதில்லை. அவள் மிகவும் தைரியமான காரியத்தைச் செய்தாள்.','అనాయ అమ్మకు చెబుతుంది. అమ్మ ఆమెను నమ్ముతుంది, హత్తుకుంటుంది, చైల్డ్‌లైన్‌కు ఫోన్ చేస్తుంది. అనాయ సురక్షితంగా ఉంది, తోడు దొరికింది, ఎప్పుడూ నిందించబడదు. ఆమె అత్యంత ధైర్యమైన పని చేసింది.','ਅਨਾਇਆ ਮੰਮੀ ਨੂੰ ਦੱਸਦੀ ਹੈ। ਮੰਮੀ ਉਸ ’ਤੇ ਯਕੀਨ ਕਰਦੇ ਨੇ, ਗਲ਼ ਲਾਉਂਦੇ ਨੇ ਤੇ ਚਾਈਲਡਲਾਈਨ ਨੂੰ ਫ਼ੋਨ ਕਰਦੇ ਨੇ। ਅਨਾਇਆ ਸੁਰੱਖਿਅਤ ਹੈ, ਉਸਨੂੰ ਸਹਾਰਾ ਮਿਲਿਆ ਹੈ ਤੇ ਉਸਨੂੰ ਕਦੇ ਦੋਸ਼ ਨਹੀਂ ਦਿੱਤਾ ਜਾਂਦਾ। ਉਸਨੇ ਸਭ ਤੋਂ ਬਹਾਦਰੀ ਵਾਲਾ ਕੰਮ ਕੀਤਾ।'),
     cast:[{who:'mummy',mood:'happy',say:L('I believe you. You did nothing wrong.','मुझे तुम पर यक़ीन है। तुमने कुछ ग़लत नहीं किया।','நான் உன்னை நம்புகிறேன். நீ எந்தத் தவறும் செய்யவில்லை.','నేను నిన్ను నమ్ముతున్నాను. నువ్వు ఏ తప్పూ చేయలేదు.','ਮੈਨੂੰ ਤੇਰੇ ’ਤੇ ਯਕੀਨ ਹੈ। ਤੂੰ ਕੁਝ ਗ਼ਲਤ ਨਹੀਂ ਕੀਤਾ।')},{who:'anaya',mood:'happy',wave:true}]},
    {label:L('Think it is her own fault.','सोचो कि यह उसकी अपनी ग़लती है।','இது தன் தவறுதான் என்று நினை.','ఇది తన తప్పే అనుకో.','ਸੋਚੋ ਕਿ ਇਹ ਉਸਦੀ ਆਪਣੀ ਗ਼ਲਤੀ ਹੈ।'),ok:false,bg:'home',
     text:L('It is NEVER the child\'s fault. Never. Only the grown-up who did the wrong thing is responsible. Anaya deserves help and kindness.','यह बच्चे की ग़लती कभी नहीं होती। कभी नहीं। ग़लत काम करने वाला बड़ा ही ज़िम्मेदार है। अनाया को मदद और प्यार मिलना चाहिए।','இது குழந்தையின் தவறு ஒருபோதும் அல்ல. ஒருபோதும் இல்லை. தவறு செய்த பெரியவர் மட்டுமே பொறுப்பு. அனாயா உதவியும் அன்பும் பெறத் தகுதியானவள்.','ఇది పిల్లల తప్పు ఎప్పుడూ కాదు. ఎప్పుడూ కాదు. తప్పు చేసిన పెద్దవాడిదే బాధ్యత. అనాయకు సాయం, ప్రేమ దక్కాలి.','ਇਹ ਬੱਚੇ ਦੀ ਗ਼ਲਤੀ ਕਦੇ ਨਹੀਂ ਹੁੰਦੀ। ਕਦੇ ਵੀ ਨਹੀਂ। ਗ਼ਲਤ ਕੰਮ ਕਰਨ ਵਾਲਾ ਵੱਡਾ ਹੀ ਜ਼ਿੰਮੇਵਾਰ ਹੈ। ਅਨਾਇਆ ਮਦਦ ਤੇ ਪਿਆਰ ਦੀ ਹੱਕਦਾਰ ਹੈ।'),

 law:{act:L('POCSO Act, 2012 (Protection of Children from Sexual Offences)','पॉक्सो अधिनियम, 2012 (बच्चों का यौन अपराधों से संरक्षण)','போக்சோ சட்டம், 2012 (குழந்தைகளைப் பாலியல் குற்றங்களிலிருந்து பாதுகாக்கும் சட்டம்)','పోక్సో చట్టం, 2012 (పిల్లలను లైంగిక నేరాల నుండి రక్షించే చట్టం)','ਪੋਕਸੋ ਐਕਟ, 2012 (ਬੱਚਿਆਂ ਨੂੰ ਜਿਨਸੀ ਅਪਰਾਧਾਂ ਤੋਂ ਸੁਰੱਖਿਆ)'),
  points:[
   L('It protects every child under 18, girls and boys.','यह 18 साल से कम हर बच्चे की रक्षा करता है, लड़कियों और लड़कों की।','18 வயதுக்குக் கீழ் உள்ள ஒவ்வொரு குழந்தையையும், பெண் குழந்தை, ஆண் குழந்தை இருவரையும் இது பாதுகாக்கிறது.','18 ఏళ్ల లోపు ప్రతి బిడ్డను, ఆడపిల్లలను మగపిల్లలను ఇది కాపాడుతుంది.','ਇਹ 18 ਸਾਲ ਤੋਂ ਘੱਟ ਹਰ ਬੱਚੇ ਦੀ ਰਾਖੀ ਕਰਦਾ ਹੈ, ਕੁੜੀਆਂ ਤੇ ਮੁੰਡਿਆਂ ਦੀ।'),
   L('Touching a child in unsafe ways is a serious crime with strict punishment.','बच्चे को असुरक्षित तरीक़े से छूना गंभीर अपराध है जिसकी सख़्त सज़ा है।','குழந்தையைப் பாதுகாப்பற்ற முறையில் தொடுவது கடுமையான தண்டனைக்குரிய பெரிய குற்றம்.','పిల్లలను అసురక్షితంగా తాకడం కఠిన శిక్ష విధించే తీవ్ర నేరం.','ਬੱਚੇ ਨੂੰ ਅਸੁਰੱਖਿਅਤ ਢੰਗ ਨਾਲ ਛੂਹਣਾ ਗੰਭੀਰ ਅਪਰਾਧ ਹੈ, ਜਿਸਦੀ ਸਖ਼ਤ ਸਜ਼ਾ ਹੈ।'),
   L('It is never the child\'s fault, even if the person is a relative, teacher or neighbour.','यह बच्चे की ग़लती कभी नहीं होती, चाहे वह व्यक्ति रिश्तेदार, शिक्षक या पड़ोसी ही क्यों न हो।','அந்த நபர் உறவினர், ஆசிரியர் அல்லது அண்டை வீட்டார் யாராக இருந்தாலும் இது குழந்தையின் தவறு அல்ல.','ఆ వ్యక్తి బంధువైనా, ఉపాధ్యాయుడైనా, పొరుగువాడైనా ఇది పిల్లల తప్పు కాదు.','ਉਹ ਵਿਅਕਤੀ ਰਿਸ਼ਤੇਦਾਰ, ਅਧਿਆਪਕ ਜਾਂ ਗੁਆਂਢੀ ਹੋਵੇ, ਇਹ ਬੱਚੇ ਦੀ ਗ਼ਲਤੀ ਕਦੇ ਨਹੀਂ।'),
   L('Anyone who knows must report it to the police or Childline. Your identity is kept secret.','जो भी जानता है उसे पुलिस या चाइल्डलाइन को बताना ज़रूरी है। तुम्हारी पहचान गुप्त रखी जाती है।','தெரிந்த எவரும் காவல்துறைக்கோ சைல்டுலைனுக்கோ தெரிவிக்க வேண்டும். உன் அடையாளம் ரகசியமாக வைக்கப்படும்.','తెలిసిన ఎవరైనా పోలీసులకు లేదా చైల్డ్‌లైన్‌కు చెప్పాలి. నీ గుర్తింపు రహస్యంగా ఉంచబడుతుంది.','ਜਿਸਨੂੰ ਵੀ ਪਤਾ ਹੋਵੇ, ਉਸਨੂੰ ਪੁਲਿਸ ਜਾਂ ਚਾਈਲਡਲਾਈਨ ਨੂੰ ਦੱਸਣਾ ਜ਼ਰੂਰੀ ਹੈ। ਤੁਹਾਡੀ ਪਛਾਣ ਗੁਪਤ ਰੱਖੀ ਜਾਂਦੀ ਹੈ।')],
  remember:L('My body belongs to me. No secret that scares me is mine to keep.','मेरा शरीर मेरा है। जो राज़ मुझे डराए, उसे रखना मेरा काम नहीं।','என் உடல் எனக்குச் சொந்தம். என்னைப் பயமுறுத்தும் ரகசியத்தை நான் வைத்திருக்கத் தேவையில்லை.','నా శరీరం నాది. నన్ను భయపెట్టే రహస్యాన్ని దాచాల్సిన పని లేదు.','ਮੇਰਾ ਸਰੀਰ ਮੇਰਾ ਹੈ। ਜੋ ਭੇਤ ਮੈਨੂੰ ਡਰਾਏ, ਉਸਨੂੰ ਰੱਖਣਾ ਮੇਰਾ ਫ਼ਰਜ਼ ਨਹੀਂ।'),
  help:[H.trusted,H.teacher,H.child,H.police]},
 quiz:[
  {q:L('Whose fault is it if a grown-up touches a child in an unsafe way?','अगर कोई बड़ा बच्चे को असुरक्षित तरीक़े से छूए तो ग़लती किसकी है?','ஒரு பெரியவர் குழந்தையைப் பாதுகாப்பற்ற முறையில் தொட்டால் தவறு யாருடையது?','ఒక పెద్దవాడు పిల్లలను అసురక్షితంగా తాకితే తప్పు ఎవరిది?','ਜੇ ਕੋਈ ਵੱਡਾ ਬੱਚੇ ਨੂੰ ਅਸੁਰੱਖਿਅਤ ਢੰਗ ਨਾਲ ਛੂਹੇ ਤਾਂ ਗ਼ਲਤੀ ਕਿਸਦੀ ਹੈ?'),
   o:[L('The child\'s','बच्चे की','குழந்தையின்','పిల్లలది','ਬੱਚੇ ਦੀ'),L('Sometimes the child\'s','कभी-कभी बच्चे की','சில நேரம் குழந்தையின்','కొన్నిసార్లు పిల్లలది','ਕਦੇ-ਕਦੇ ਬੱਚੇ ਦੀ'),L('Never the child\'s. Only the grown-up\'s','कभी बच्चे की नहीं। सिर्फ़ बड़े की','ஒருபோதும் குழந்தையின் அல்ல. பெரியவரின் மட்டுமே','ఎప్పుడూ పిల్లలది కాదు. పెద్దవాడిదే','ਕਦੇ ਬੱਚੇ ਦੀ ਨਹੀਂ। ਸਿਰਫ਼ ਵੱਡੇ ਦੀ')],a:2},
  {q:L('A grown-up says "keep it our secret" about something that scares you. What do you do?','कोई बड़ा कहता है "यह हमारा राज़ रखना", जबकि वह बात तुम्हें डराती है। तुम क्या करोगे?','உன்னைப் பயமுறுத்தும் ஒன்றைப் பற்றி ஒரு பெரியவர் "இது நம் ரகசியம்" என்கிறார். நீ என்ன செய்வாய்?','నీకు భయం కలిగించే విషయం గురించి ఒక పెద్దవాడు "ఇది మన రహస్యం" అంటాడు. నువ్వు ఏమి చేస్తావు?','ਕੋਈ ਵੱਡਾ ਤੁਹਾਨੂੰ ਡਰਾਉਣ ਵਾਲੀ ਗੱਲ ਬਾਰੇ ਕਹਿੰਦਾ ਹੈ "ਇਹ ਸਾਡਾ ਭੇਤ ਰੱਖੀਂ"। ਤੁਸੀਂ ਕੀ ਕਰੋਗੇ?'),
   o:[L('Keep it forever','हमेशा राज़ रखूँगा','எப்போதும் ரகசியமாக வைப்பேன்','ఎప్పటికీ రహస్యంగా ఉంచుతా','ਹਮੇਸ਼ਾ ਭੇਤ ਰੱਖਾਂਗਾ'),L('Tell a trusted adult','किसी भरोसेमंद बड़े को बताऊँगा','நம்பகமான பெரியவரிடம் சொல்வேன்','నమ్మకమైన పెద్దవాళ్లకు చెబుతా','ਕਿਸੇ ਭਰੋਸੇਮੰਦ ਵੱਡੇ ਨੂੰ ਦੱਸਾਂਗਾ'),L('Wait a year','एक साल रुकूँगा','ஒரு வருடம் காத்திருப்பேன்','ఒక ఏడాది ఆగుతా','ਇੱਕ ਸਾਲ ਉਡੀਕਾਂਗਾ')],a:1},
  {q:L('Does the POCSO law protect boys too?','क्या पॉक्सो क़ानून लड़कों की भी रक्षा करता है?','போக்சோ சட்டம் ஆண் குழந்தைகளையும் பாதுகாக்குமா?','పోక్సో చట్టం మగపిల్లలను కూడా రక్షిస్తుందా?','ਕੀ ਪੋਕਸੋ ਕਾਨੂੰਨ ਮੁੰਡਿਆਂ ਦੀ ਵੀ ਰਾਖੀ ਕਰਦਾ ਹੈ?'),
   o:[L('Only girls','सिर्फ़ लड़कियों की','பெண் குழந்தைகளை மட்டும்','ఆడపిల్లలను మాత్రమే','ਸਿਰਫ਼ ਕੁੜੀਆਂ ਦੀ'),L('Yes, every child under 18','हाँ, 18 से कम हर बच्चे की','ஆம், 18 வயதுக்குக் கீழ் உள்ள எல்லோரையும்','అవును, 18 ఏళ్ల లోపు ప్రతి బిడ్డను','ਹਾਂ, 18 ਸਾਲ ਤੋਂ ਘੱਟ ਹਰ ਬੱਚੇ ਦੀ'),L('Only teenagers','सिर्फ़ किशोरों की','வளரிளம் பருவத்தினரை மட்டும்','కౌమారులను మాత్రమే','ਸਿਰਫ਼ ਕਿਸ਼ੋਰਾਂ ਦੀ')],a:1}
 ],
 teach:{
  obj:[L('Children learn that body safety is their right and abuse is never their fault.','बच्चे जानें कि शरीर की सुरक्षा उनका अधिकार है और दुर्व्यवहार कभी उनकी ग़लती नहीं।'),L('Children name at least two trusted adults they can tell, and know 1098.','बच्चे कम से कम दो भरोसेमंद बड़ों के नाम बताएँ और 1098 जानें।')],
